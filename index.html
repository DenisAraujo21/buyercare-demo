<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Codeart CodeLar</title>
<!-- PWA: instalar na tela de inicio e abrir 100% em tela cheia, sem barra de navegador -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#303e47">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CodeLar">
<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
</script>
<style>
@font-face{font-family:"All Round Gothic";src:url("assets/fonts/AllRoundGothic-XLight.ttf") format("truetype");font-weight:200;font-display:swap}
@font-face{font-family:"All Round Gothic";src:url("assets/fonts/AllRoundGothic-Book.ttf") format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"All Round Gothic";src:url("assets/fonts/AllRoundGothic-Demi.ttf") format("truetype");font-weight:600;font-display:swap}
@font-face{font-family:"All Round Gothic";src:url("assets/fonts/AllRoundGothic-Bold.ttf") format("truetype");font-weight:700;font-display:swap}
@font-face{font-family:"Outfit";src:url("assets/fonts/Outfit-Variable.ttf") format("truetype-variations");font-weight:100 900;font-display:swap}

:root{
  --font-display:"All Round Gothic","Outfit",system-ui,sans-serif; --font-sans:"Outfit",system-ui,-apple-system,sans-serif;
  --charcoal:#303E47; --sky:#6CC0ED; --sun:#FED600;
  --page:#F2F2F2; --surface:#FFFFFF; --surface-2:#F2F2F2; --border:#E4E7E9; --border-strong:#CBD1D5;
  --text:#303E47; --muted:#566068; --accent:#2E97CE; --accent-soft:#E1F2FB;
  --success:#1F8A57; --success-soft:#E4F5EC; --warning:#9A7000; --warning-soft:#FFF3D1; --danger:#B8423C; --danger-soft:#FBE7E6;
  --sun-soft:#FFF7C2; --sun-text:#7A6200; --primary-bg:#303E47; --primary-text:#FFFFFF;
  --card-shadow:0 2px 6px rgba(48,62,71,.08); --card-border:transparent; --hover:#F7F8F9; --unread:#FFFDF0;
  --chrome-bg:#FFFFFF; --chrome-text:#303E47; --chrome-muted:#74818A; --chrome-active:#303E47; --chrome-border:#E4E7E9; --chrome-hover:rgba(48,62,71,.06);
  --shadow-sm:0 2px 6px rgba(48,62,71,.12); --shadow-lg:0 18px 44px rgba(48,62,71,.18); --focus:0 0 0 3px rgba(108,192,237,.45);
  --stage:#E4E7E9; --home-indicator:#303E47;
}
@media (prefers-color-scheme:dark){
  :root:not([data-tema="claro"]){
    --page:#1D262C; --surface:#263039; --surface-2:#303E47; --border:#3B4C57; --border-strong:#4A5C68;
    --text:#F2F2F2; --muted:#CBD1D5; --accent:#6CC0ED; --accent-soft:rgba(108,192,237,.16);
    --success:#4CC287; --success-soft:rgba(76,194,135,.16); --warning:#E0AC4A; --warning-soft:rgba(224,172,74,.16); --danger:#E2726C; --danger-soft:rgba(226,114,108,.16);
    --sun-soft:rgba(254,214,0,.16); --sun-text:#FFE862; --primary-bg:#FED600; --primary-text:#303E47;
    --card-shadow:none; --card-border:#3B4C57; --hover:rgba(255,255,255,.04); --unread:rgba(254,214,0,.06);
    --chrome-bg:#263039; --chrome-text:#F2F2F2; --chrome-muted:#9FA9AF; --chrome-active:#F2F2F2; --chrome-border:rgba(255,255,255,.08); --chrome-hover:rgba(255,255,255,.08);
    --stage:#14191D; --home-indicator:#F2F2F2;
  }
}
:root[data-tema="escuro"]{
  --page:#1D262C; --surface:#263039; --surface-2:#303E47; --border:#3B4C57; --border-strong:#4A5C68;
  --text:#F2F2F2; --muted:#CBD1D5; --accent:#6CC0ED; --accent-soft:rgba(108,192,237,.16);
  --success:#4CC287; --success-soft:rgba(76,194,135,.16); --warning:#E0AC4A; --warning-soft:rgba(224,172,74,.16); --danger:#E2726C; --danger-soft:rgba(226,114,108,.16);
  --sun-soft:rgba(254,214,0,.16); --sun-text:#FFE862; --primary-bg:#FED600; --primary-text:#303E47;
  --card-shadow:none; --card-border:#3B4C57; --hover:rgba(255,255,255,.04); --unread:rgba(254,214,0,.06);
  --chrome-bg:#263039; --chrome-text:#F2F2F2; --chrome-muted:#9FA9AF; --chrome-active:#F2F2F2; --chrome-border:rgba(255,255,255,.08); --chrome-hover:rgba(255,255,255,.08);
  --stage:#14191D; --home-indicator:#F2F2F2;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font-sans);font-size:16px;line-height:1.45;background:var(--stage);color:var(--text);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:0;height:0}
b{font-weight:600}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}

/* moldura: tela cheia no celular, "aparelho" no desktop */
.stage{height:100%;display:flex;align-items:center;justify-content:center}
.device{position:relative;display:flex;flex-direction:column;overflow:hidden;background:var(--page);color:var(--text);width:100%;height:100%}
@media (min-width:520px){
  .stage{padding:28px 16px}
  .device{width:min(calc(100vw - 32px),404px);height:auto;max-height:100%;aspect-ratio:9/19.5;border-radius:40px;box-shadow:0 0 0 12px #263039,0 0 0 13px rgba(255,255,255,.05),var(--shadow-lg)}
}
@media (display-mode:standalone){.device{padding-top:env(safe-area-inset-top,0)}}

.screen-pad{padding:16px 16px 110px;animation:rise .22s ease-out both}
header.appbar{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:calc(14px + env(safe-area-inset-top,0px)) 12px 10px;background:var(--chrome-bg);border-bottom:1px solid var(--chrome-border);position:relative;z-index:20}
@media (min-width:520px){header.appbar{padding-top:44px}}
header.appbar h1{margin:0 0 0 4px;font-family:var(--font-display);font-size:20px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--chrome-text);letter-spacing:-.01em}
.iconbtn{width:44px;height:44px;border-radius:12px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--chrome-text);flex:0 0 auto;position:relative}
.iconbtn:hover{background:var(--chrome-hover)}
.iconbtn.back{margin-left:-4px}
.unit-chip{display:flex;align-items:center;gap:6px;min-height:36px;padding:0 10px 0 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;flex:0 0 auto;max-width:150px}
.bell-badge{position:absolute;top:8px;right:8px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--sun);color:#303E47;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
main#view{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;position:relative;min-height:0}
.offline{display:flex;align-items:center;gap:10px;background:var(--text);color:var(--page);padding:10px 16px;font-size:13.5px;font-weight:600}
.offline button{background:rgba(255,255,255,.15);border:none;color:inherit;font-weight:600;font-size:13px;border-radius:999px;min-height:32px;padding:0 12px;cursor:pointer}

nav.tabbar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--chrome-bg);border-top:1px solid var(--chrome-border);padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px));z-index:20}
@media (min-width:520px){nav.tabbar{padding-bottom:22px}}
.tab-btn{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:6px 8px;min-width:64px;min-height:52px;color:var(--chrome-muted)}
.tab-btn.active{color:var(--chrome-active)}
.tab-btn span.lb{font-size:11px;font-weight:600;letter-spacing:.02em}
.tab-btn i{width:5px;height:5px;border-radius:50%;background:var(--sun);opacity:0}
.tab-btn.active i{opacity:1}
.home-ind{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:120px;height:4px;border-radius:2px;background:var(--home-indicator);opacity:.25;z-index:60;pointer-events:none}
@media (max-width:519px){.home-ind{display:none}}
.toast{position:absolute;left:16px;right:16px;bottom:100px;background:var(--text);color:var(--page);padding:12px 16px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;z-index:90;pointer-events:none;transition:opacity .2s,transform .2s;opacity:0;transform:translateY(8px)}
.toast.show{opacity:1;transform:none}
.toast svg{flex:0 0 auto;color:var(--sun)}

/* tipografia */
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.eyebrow.m0{margin:0}.eyebrow.mt{margin:24px 0 10px}
.h2{font-family:var(--font-display);font-size:24px;font-weight:600;margin:0 0 6px;line-height:1.2;letter-spacing:-.01em}
.h2.big{font-size:26px;line-height:1.15}
.lead{margin:0 0 18px;color:var(--muted);font-size:15px;line-height:1.5}
.muted{color:var(--muted)}
.sm{font-size:13px;color:var(--muted);line-height:1.5}
.disp{font-family:var(--font-display);font-weight:600}
.tnum{font-variant-numeric:tabular-nums}
.center{text-align:center}

/* superficies */
.card{background:var(--surface);border:1px solid var(--card-border);box-shadow:var(--card-shadow);border-radius:18px;overflow:hidden;margin-bottom:16px}
.card.pad{padding:18px;overflow:visible}
.card.lg{border-radius:20px}
.card.dark{background:#303E47;color:#F2F2F2;border-color:transparent;position:relative;overflow:hidden}
.ring{position:absolute;border-radius:50%;border:16px solid var(--sun);pointer-events:none}
.row{width:100%;background:transparent;border:none;border-top:1px solid var(--border);padding:14px 16px;min-height:64px;display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left;color:var(--text)}
.row:first-child{border-top:none}
.row:hover{background:var(--hover)}
.row .grow{flex:1;min-width:0}
.row .t{display:block;font-weight:600;font-size:15px}
.row .s{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.kv{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font-size:15px;gap:10px;border-top:1px solid var(--border)}
.kv:first-child{border-top:none}
.kv .k{color:var(--muted)}.kv .v{font-weight:600;text-align:right}
.ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ic.sm40{width:36px;height:36px}
.ic.xl{width:52px;height:52px;border-radius:16px}
.t-success{background:var(--success-soft);color:var(--success)}.t-danger{background:var(--danger-soft);color:var(--danger)}
.t-warning{background:var(--warning-soft);color:var(--warning)}.t-accent{background:var(--accent-soft);color:var(--accent)}
.t-sun{background:var(--sun-soft);color:var(--sun-text)}.t-neutral{background:var(--surface-2);color:var(--text)}
.note{display:flex;align-items:flex-start;gap:12px;border-radius:16px;padding:14px 16px;margin-bottom:16px;font-size:14px;line-height:1.5}
.note.n-accent{background:var(--accent-soft)}.note.n-warning{background:var(--warning-soft)}.note.n-danger{background:var(--danger-soft)}.note.n-sun{background:var(--sun-soft)}
.note b{font-size:15px}.note > svg{flex:0 0 auto;margin-top:2px}
.pill-note{background:var(--accent-soft);border-radius:14px;padding:12px 16px;margin-bottom:16px;font-size:14px;line-height:1.5}
.pill-note .l{color:var(--muted)}

/* botoes */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;min-height:48px;padding:0 20px;font-weight:600;font-size:15px;border:1px solid transparent;cursor:pointer;width:100%;transition:transform .12s;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.lg{min-height:50px;border-radius:14px;font-size:16px}
.btn.sm{min-height:44px}
.btn.auto{width:auto;flex:none}
.btn-primary{background:var(--primary-bg);color:var(--primary-text)}
.btn-secondary{background:var(--surface);color:var(--text);border-color:var(--border-strong)}
.btn-sun{background:var(--sun);color:#303E47}
.btn-white{background:#fff;color:#303E47}
.btn-outline-dark{background:transparent;color:#F2F2F2;border-color:rgba(255,255,255,.25)}
.btn-link{background:transparent;border:none;color:var(--accent);min-height:44px;padding:0;width:auto;font-size:14px}
.btn-muted{background:transparent;border:none;color:var(--muted);min-height:44px}
.btn-danger-link{background:transparent;border:none;color:var(--danger);min-height:44px;padding:0 4px;width:auto;font-size:14px}
.btns{display:flex;gap:10px}.btns .btn{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid var(--border-strong);border-top-color:#303E47;animation:spin .7s linear infinite;display:inline-block}

.badge{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.b-success{background:var(--success-soft);color:var(--success)}.b-danger{background:var(--danger-soft);color:var(--danger)}
.b-warning{background:var(--warning-soft);color:var(--warning)}.b-sky{background:var(--accent-soft);color:var(--accent)}
.b-neutral{background:var(--surface-2);color:var(--muted)}.b-charcoal{background:#303E47;color:#F2F2F2}

/* formularios */
label.lb{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.inp,select.inp,textarea.inp{width:100%;background:var(--surface);border:1px solid var(--border-strong);border-radius:14px;min-height:50px;padding:0 16px;font-size:16px;color:var(--text);outline:none}
textarea.inp{padding:12px 14px;resize:vertical;min-height:100px}
.inp:focus{box-shadow:var(--focus);border-color:var(--sky)}
.inp.big{font-size:17px;font-variant-numeric:tabular-nums}
.field{margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-size:14px;font-weight:600;cursor:pointer}
.chip.on{background:var(--primary-bg);color:var(--primary-text);border-color:var(--primary-bg)}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.day{min-height:64px;border-radius:14px;border:2px solid var(--card-border);background:var(--surface);box-shadow:var(--card-shadow);color:var(--text);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.day small{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;opacity:.8}
.day b{font-family:var(--font-display);font-size:20px}
.day.on{border-color:var(--primary-bg);background:var(--primary-bg);color:var(--primary-text)}
.toggle{width:52px;height:32px;border-radius:999px;border:none;background:var(--border-strong);position:relative;cursor:pointer;flex:0 0 auto;transition:background .2s;padding:0}
.toggle i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:var(--shadow-sm);transition:left .2s}
.toggle.on{background:var(--success)}.toggle.on i{left:23px}
.progress{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}.progress i{display:block;height:100%;border-radius:99px}
.dots{display:flex;gap:6px}.dots span{flex:1;height:4px;border-radius:2px;background:var(--border)}.dots span.on{background:var(--sun)}
.choice{min-height:52px;padding:0 14px;border-radius:14px;border:2px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;display:flex;align-items:center;gap:12px;text-align:left;width:100%;font-size:15px;font-weight:600}
.choice.on{border-color:var(--primary-bg)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--border-strong);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.choice.on .radio{border-color:var(--primary-bg)}.radio i{width:10px;height:10px;border-radius:50%;background:var(--primary-bg)}
.checkbox{width:24px;height:24px;border-radius:7px;border:2px solid var(--border-strong);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:#fff}
.checkbox.on{background:var(--success);border-color:var(--success)}

/* linha do tempo */
.tl{display:flex;gap:14px}
.tl .rail{display:flex;flex-direction:column;align-items:center;width:20px}
.tl .dot{border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;margin-top:3px;color:#fff}
.tl .ln{width:2px;flex:1;min-height:16px;margin:4px 0;background:var(--border)}
.tl .ln.done{background:var(--success)}
.tl .tx{padding-bottom:12px;flex:1;min-width:0}
.tl.last .ln{display:none}

/* login */
.login{flex:1;min-height:0;overflow-y:auto;background:#303E47;position:relative;color:#F2F2F2}
.login .in{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 28px 32px;text-align:center;position:relative}
.login .logo{font-family:var(--font-display);font-size:34px;font-weight:600;margin:0;letter-spacing:-.01em;line-height:1;color:#F2F2F2}
.login .logo span{color:var(--sun)}
.login .inp{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#F2F2F2;text-align:left}
.login .inp::placeholder{color:#9FA9AF}
.chat-bubble{max-width:84%;padding:12px 15px;border-radius:18px;font-size:15px;line-height:1.5;box-shadow:var(--card-shadow)}
.chat-bubble.bot{background:var(--surface);align-self:flex-start;border-bottom-left-radius:6px}
.chat-bubble.user{background:var(--primary-bg);color:var(--primary-text);align-self:flex-end;border-bottom-right-radius:6px}
.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--surface-2);border-radius:14px;padding:12px}
.mini .k{display:block;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mini b{font-family:var(--font-display);font-size:20px;display:block;margin-top:4px}
.quick{background:var(--surface);border:1px solid var(--card-border);box-shadow:var(--card-shadow);border-radius:18px;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;min-width:0;text-align:left;min-height:64px;transition:transform .12s;color:var(--text)}
.quick:active{transform:scale(.98)}
.photo{aspect-ratio:16/9;position:relative;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;border-bottom:1px solid var(--border);overflow:hidden}
.photo svg.ill{position:absolute;inset:0;width:100%;height:100%}
.photo .tag{position:absolute;top:12px;left:12px;background:var(--text);color:var(--page);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;border-radius:999px}
.swatch-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatch{background:var(--surface);border:2px solid var(--card-border);box-shadow:var(--card-shadow);border-radius:18px;padding:12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0;color:var(--text)}
.swatch.on{border-color:var(--primary-bg)}
.swatch .sw{width:100%;aspect-ratio:3/2;border-radius:12px;display:block;position:relative}
.swatch .ck{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:var(--primary-bg);color:var(--primary-text);display:flex;align-items:center;justify-content:center}
.rate{display:flex;justify-content:space-between;gap:6px;margin-bottom:8px}
.rate button{flex:1;aspect-ratio:1;max-width:60px;border-radius:14px;border:2px solid var(--border);background:var(--surface);color:var(--text);font-family:var(--font-display);font-size:20px;font-weight:600;cursor:pointer}
.rate button.on{background:var(--primary-bg);color:var(--primary-text);border-color:var(--primary-bg)}

</style>
</head>
<body>
<div class="stage">
  <div class="device" id="device">
    <div id="root" style="flex:1;min-height:0;display:flex;flex-direction:column;"></div>
    <div class="home-ind"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</div>
<script>
/* =====================================================================================
   CodeLar - redesign (Codeart Design System). Mesma arquitetura de antes: SCREENS + pilhas por
   aba (state.stacks) + go/goBack/switchTab, e os mesmos endpoints do proxy (proxy/worker.js).
   Abas: Inicio, Financeiro, Meu imovel, Ajuda. Dados reais vem do Salesforce (via proxy) quando

/* ---------- helpers de marcacao ---------- */
function escHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function jsq(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;'); }
function brl(v){ return 'R$ ' + Number(v||0).toLocaleString('pt-BR', {minimumFractionDigits:0, maximumFractionDigits:0}); }
const eyebrow = (t, cls) => `<p class="eyebrow ${cls||''}">${t}</p>`;
const badge = (tone, t) => `<span class="badge b-${tone}">${t}</span>`;
const mascote = (nome, w, extra) => MASCOTE ? `<img src="assets/arti-${nome}.png" alt="Arti, mascote da Codeart" style="width:${w}px;height:${w}px;object-fit:contain;${extra||''}">` : '';
const btn = (label, onclick, variant, extra) => `<button class="btn ${variant||'btn-primary'} ${extra||''}" onclick="${onclick}">${label}</button>`;
const icChip = (name, tone, cls) => `<span class="ic t-${tone} ${cls||''}">${ic(name,20)}</span>`;
function noteBox(tone, icon, titulo, texto){
  const cor = tone==='accent'?'var(--accent)':tone==='warning'?'var(--warning)':tone==='danger'?'var(--danger)':'var(--sun-text)';
  return `<div class="note n-${tone}">${ic(icon,20).replace('<svg','<svg style="color:'+cor+'"')}<div><b style="color:${cor};">${titulo}</b>${texto?`<div style="font-size:14px;margin-top:3px;line-height:1.5;color:var(--text);">${texto}</div>`:''}</div></div>`;
}
function timelineHtml(itens, idxAtual, opts){
  /* itens: [{nome, sub}] - bolinhas: concluido (verde com check), atual (azul com halo), futuro (cinza) */
  opts = opts || {};
  return itens.map((e,i)=>{
    const done = i<idxAtual, cur = i===idxAtual, last = i===itens.length-1;
    const size = cur?18:14;
    const bg = done?'var(--success)':cur?'var(--accent)':'var(--border)';
    const halo = cur?'box-shadow:0 0 0 4px var(--accent-soft);':'';
    return `<div class="tl ${last?'last':''}"><div class="rail"><div class="dot" style="width:${size}px;height:${size}px;background:${bg};${halo}">${done?ic('check',9,3):''}</div><div class="ln ${done?'done':''}"></div></div>
      <div class="tx"><span style="display:block;font-size:15px;font-weight:${cur?700:done?600:500};color:${cur?'var(--accent)':done?'var(--text)':'var(--muted)'};">${escHtml(e.nome)}</span>${e.sub?`<span class="sm" style="display:block;">${escHtml(e.sub)}</span>`:''}</div></div>`;
  }).join('');
}

/* ---------- toast ---------- */
function toast(msg){
  const t = document.getElementById('toast');
  if(!t) return;
  t.innerHTML = ic('check',16,2.6) + '<span>'+escHtml(msg)+'</span>';
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 2400);
}

function currentStack(){ return state.stacks[state.tab]; }
function topo(){ const s = currentStack(); return s[s.length-1]; }
function currentScreen(){
  const top = topo();
  return SCREENS[top.screen](top.params||{});
}
function go(screen, params){
  currentStack().push({screen, params});
  render({resetScroll:true});
}
function replaceTop(screen, params){
  currentStack()[currentStack().length-1] = {screen, params};
  render({resetScroll:true});
}
function resetTabTo(screen, params){
  state.stacks[state.tab] = [{screen, params}];
  render({resetScroll:true});
}
function goBack(){
  if(currentStack().length>1){ currentStack().pop(); render({resetScroll:true}); }
}
/* switchTab('ajuda') abre a raiz; switchTab('financeiro','parcelaDetail',{id}) abre a raiz + a tela.
   Tocar na aba ja ativa volta pra raiz dela. */
function switchTab(tab, screen, params){
  if(state.tab===tab && !screen) state.stacks[tab] = [state.stacks[tab][0]];
  if(screen) state.stacks[tab] = [state.stacks[tab][0], {screen, params}];
  state.tab = tab;
  render({resetScroll:true});
}
function selecionarUnidade(id){
  if(id===state.contratoAtivo){ goBack(); return; }
  state.contratoAtivo = id;
  state.stacks = pilhasNovas();
  if(contratoAtivo().pv) sincronizarEstadoLocal(contratoAtivo());
  toast('Mostrando: '+contratoAtivo().contrato.empreendimento+' · '+contratoAtivo().contrato.unidade);
  render({resetScroll:true});
}

/* ---------- casca: login / primeiro acesso / boas-vindas / app ---------- */
const TAB_DEFS = [['inicio','Início','home'],['financeiro','Financeiro','wallet'],['obra','Meu imóvel','building'],['ajuda','Ajuda','headset']];
function render(opts){
  opts = opts || {};
  const root = document.getElementById('root');
  const prev = document.getElementById('view');
  const scrollTop = prev ? prev.scrollTop : 0;
  let foco = null;
  const ae = document.activeElement;
  if(ae && ae.id && root.contains(ae)) foco = {id:ae.id, ini:ae.selectionStart, fim:ae.selectionEnd};

  if(state.mode==='login'){ root.innerHTML = loginHtml(); return; }
  if(state.mode==='primeiroAcesso'){ root.innerHTML = primeiroAcessoHtml(); return; }
  if(state.mode==='onboarding'){ root.innerHTML = onboardingHtml(); return; }

  const top = topo();
  const s = currentScreen();
  const raiz = currentStack().length===1;
  const multi = DB.contratos.length>1;
  const naoLidos = avisosLista().filter(a=>!state.avisosLidos.includes(a.id)).length;
  const header = `
    <header class="appbar">
      ${!raiz ? `<button class="iconbtn back" onclick="goBack()" aria-label="Voltar">${ic('back',22)}</button>` : ''}
      <h1>${escHtml(s.title)}</h1>
      ${raiz && multi && top.screen!=='selecionarUnidade' ? `<button class="unit-chip" onclick="go('selecionarUnidade')" aria-label="Trocar de unidade"><span style="white-space:nowrap;">${escHtml(contratoAtivo().contrato.unidade)}</span>${ic('chevdown',14,2.2)}</button>` : ''}
      ${raiz ? `<button class="iconbtn" onclick="go('avisos')" aria-label="Avisos">${ic('bell',22)}${naoLidos?`<span class="bell-badge">${naoLidos}</span>`:''}</button>` : ''}
      ${top.screen==='inicio' ? `<button class="iconbtn" onclick="doLogout()" aria-label="Sair">${ic('logout',20)}</button>` : ''}
    </header>`;
  const offline = state.offline ? `<div class="offline">${ic('wifioff',18)}<span style="flex:1;">Sem conexão. Mostrando dados de ${escHtml(state.offlineDesde||'agora há pouco')}.</span><button onclick="tentarReconectar()">Tentar de novo</button></div>` : '';
  const tabs = TAB_DEFS.map(([k,label,icone])=>`
    <button class="tab-btn ${k===state.tab?'active':''}" onclick="switchTab('${k}')">${ic(icone,24)}<span class="lb">${label}</span><i></i></button>`).join('');
  root.innerHTML = `${header}<main id="view">${offline}<div class="screen-pad">${s.body}</div></main><nav class="tabbar">${tabs}</nav>`;
  const view = document.getElementById('view');
  view.scrollTop = opts.resetScroll ? 0 : scrollTop;
  if(s.depois) s.depois();
  if(foco){
    const el = document.getElementById(foco.id);
    if(el){ el.focus(); try{ el.setSelectionRange(foco.ini, foco.fim); }catch(e){} }
  }
}
function rolarFim(){
  const v = document.getElementById('view');
  if(v) v.scrollTop = v.scrollHeight;
}

/* conexao: faixa "Sem conexao" (README: Estados de erro) */
function horaAgora(){ return new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
window.addEventListener('offline', ()=>{ state.offline = true; state.offlineDesde = horaAgora(); render(); });
window.addEventListener('online', ()=>{ state.offline = false; render(); recarregarDadosReais(); });
function tentarReconectar(){
  if(navigator.onLine){ state.offline = false; render(); recarregarDadosReais(); toast('Conexão restabelecida'); }
  else toast('Ainda sem conexão. Tentamos de novo em instantes.');
}
function recarregarDadosReais(){
  DB.contratos.filter(c=>c.oportunidadeId).forEach(c=>{
    carregarObraReal(c); carregarFinanceiroReal(c); carregarDocumentosReal(c); carregarAtendimentoReal(c); carregarPosVenda(c);
  });
}

async function doLogin(){
  const input = document.getElementById('loginEmail');
  const email = (input?input.value:state.loginEmail||'').trim();
  state.loginEmail = email;
  if(!email){ state.loginErro = 'Digite um e-mail para continuar.'; render(); return; }

  state.loginLoading = true;
  state.loginErro = null;
  render();

  try{
    const resp = await fetch(BUYERCARE_API_BASE + '/api/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email})
    });
    const dados = await resp.json();

    if(!resp.ok || dados.erro){
      state.loginErro = dados.erro || 'Não foi possível entrar. Tente novamente.';
      state.loginLoading = false;
      render();
      return;
    }
    if(!dados.encontrado){
      state.loginErro = 'Não encontramos nenhum contrato vinculado a este e-mail.';
      state.loginLoading = false;
      render();
      return;
    }

    aplicarLogin(dados);
    state.mode = 'app';
    state.loginLoading = false;
    render({resetScroll:true});
    recarregarDadosReais();
  }catch(e){
    state.loginErro = 'Falha de conexão com o servidor. Tente novamente.';
    state.loginLoading = false;
    render();
  }
}
/* Contrato real nasce de um modelo vazio (jornada/obra/atendimentos preenchidos depois pelas chamadas ao proxy). */
function novoContratoReal(real, i){
  // o nome da Unidade no Salesforce as vezes ja vem com o nome do empreendimento dentro
  // (ex: "TorreBlanca - Apartamento 1002") - evita repetir na tela
  let unidade = real.unidade || '';
  if(real.empreendimento && unidade.startsWith(real.empreendimento)) unidade = unidade.slice(real.empreendimento.length).replace(/^[\s\-·]+/, '');
  return {
    id:'r'+(i+1), oportunidadeId:real.oportunidadeId, permissao:real.permissao||'Titular', compartilhado:!!real.compartilhado,
    contrato:{empreendimento:real.empreendimento||'', unidade, torre:'', metragem:'', valor:real.valor||0,
      dataAssinatura: real.dataFechamento ? formatarDataBr(real.dataFechamento) : ''},
    jornada:{etapas:jornadaDe('Obra'), previsao:''},
    parcelas:[], incc:{ultimoReajuste:'', dataReajuste:'', indice:''}, temIncc:false,
    documentos:[],
    obra:{percentualGeral:0, previsao:'em breve', etapas:[], comunicados:[], carregando:true},
    atendimentos:[],
  };
}
/* Aplica a resposta de /api/login (ou do primeiro acesso): comprador, contratos reais e unidade ativa. */
function aplicarLogin(dados){
  DB.comprador.nome = dados.nome || DB.comprador.nome;
  state.sessao = dados.token || null; /* o proxy exige a sessao em toda chamada de um imovel */
  if(Array.isArray(dados.contratos) && dados.contratos.length){
    DB.contratos = dados.contratos.map(novoContratoReal);
    state.contratoAtivo = DB.contratos[0].id;
    state.stacks = pilhasNovas();
  }
}
const CONTRATOS_DEMO = DB.contratos;
function doLogout(){
  state.sessao = null;
  DB.contratos = CONTRATOS_DEMO;
  state.tab = 'inicio';
  state.contratoAtivo = 'c1';
  state.stacks = pilhasNovas();
  state.mode = 'login';
  state.loginLoading = false;
  render({resetScroll:true});
}

/* ---------- primeiro acesso (3 passos): CPF + nascimento + celular -> codigo por e-mail -> login ---------- */
function irPrimeiroAcesso(){
  state.pa = {step:'identificar', cpf:'', cel:'', nasc:'', codigo:'', erro:'', buscando:false, naoEncontrado:false};
  state.mode = 'primeiroAcesso';
  render();
}
function paVoltar(){
  if(state.pa.step==='identificar'){ state.mode = 'login'; }
  else { state.pa.step = state.pa.step==='codigo' ? 'confirmar' : 'identificar'; state.pa.erro = ''; }
  render();
}
async function paBuscar(){
  const pa = state.pa;
  if(pa.buscando) return;
  const cpf = pa.cpf.replace(/\D/g,'');
  if(cpf.length<11 || pa.cel.replace(/\D/g,'').length<10 || pa.nasc.replace(/\D/g,'').length<8){
    pa.erro = 'Confira o CPF, o celular e a data de nascimento — precisam estar completos.'; render(); return;
  }
  pa.erro = ''; pa.naoEncontrado = false; pa.buscando = true; render();
  try{
    const r = await chamarProxy('/api/primeiro-acesso', {acao:'buscar', cpf:pa.cpf, nascimento:pa.nasc, celular:pa.cel});
    pa.buscando = false;
    if(r.dados.erro){ pa.erro = r.dados.erro; render(); return; }
    if(r.dados.encontrado){
      pa.desafio = r.dados.desafioId; pa.nomeMasc = r.dados.nomeMascarado; pa.emailMasc = r.dados.emailMascarado;
      pa.imoveis = (r.dados.imoveis||[]).map(s=>s.replace(/^(.+?) · \1 [-·] /, '$1 · ')); pa.step = 'confirmar';
    } else pa.naoEncontrado = true;
  }catch(e){ pa.buscando = false; pa.erro = 'Falha de conexão. Tente novamente.'; }
  render();
}
async function paEnviarCodigo(){
  const pa = state.pa;
  if(pa.buscando) return;
  pa.buscando = true; render();
  try{
    const r = await chamarProxy('/api/primeiro-acesso', {acao:'enviar-codigo', desafioId:pa.desafio});
    pa.buscando = false;
    if(r.dados.erro){ pa.erro = r.dados.erro; pa.step = 'identificar'; render(); return; }
    pa.destino = r.dados.destino; pa.codigoDemo = r.dados.codigoDemo || ''; pa.erro = ''; pa.step = 'codigo';
    toast(r.dados.enviado ? 'Código enviado por e‑mail' : 'Não conseguimos enviar o e‑mail agora');
  }catch(e){ pa.buscando = false; pa.erro = 'Falha de conexão. Tente novamente.'; }
  render();
}
async function paConfirmarCodigo(){
  const pa = state.pa;
  if(pa.buscando) return;
  if(pa.codigo.replace(/\D/g,'').length<6){ toast('Digite os 6 dígitos do código.'); return; }
  pa.buscando = true; render();
  try{
    const r = await chamarProxy('/api/primeiro-acesso', {acao:'confirmar', desafioId:pa.desafio, codigo:pa.codigo});
    pa.buscando = false;
    if(r.dados.erro){ pa.erro = r.dados.erro; render(); return; }
    aplicarLogin(r.dados);
    state.mode = 'onboarding'; state.onbIdx = 0;
  }catch(e){ pa.buscando = false; pa.erro = 'Falha de conexão. Tente novamente.'; }
  render();

/* ---------- dados reais (via proxy -> Salesforce) ---------- */
function renderSeApp(){ if(state.mode==='app') render(); }
function formatarDataBr(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function formatarDataMesAno(iso){
  if(!iso) return '';
  const meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const [y,m] = iso.split('-');
  return meses[parseInt(m,10)-1]+'/'+y;
}
async function chamarProxy(rota, corpo){
  /* Chamadas de um imovel levam a sessao do login; o servidor confere sessao + acesso + permissao. */
  if(corpo && corpo.oportunidadeId && state.sessao) corpo = Object.assign({sessao:state.sessao}, corpo);
  const resp = await fetch(BUYERCARE_API_BASE + rota, {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(corpo)
  });
  const dados = await resp.json().catch(()=>({erro:'resposta invalida'}));
  if(dados && dados.sessaoExpirada && state.mode==='app'){
    doLogout();
    state.loginErro = 'Sua sessão expirou. Entre novamente.';
    render();
  }
  return {ok: resp.ok && !dados.erro, dados};
}

/* Historico real de CA_EvolucaoObra__c do empreendimento. Roda em paralelo depois do login. */
async function carregarObraReal(contrato){
  if(!contrato.oportunidadeId) return;
  contrato.obra.carregando = true;
  renderSeApp();
  try{
    const r = await chamarProxy('/api/obra', {oportunidadeId: contrato.oportunidadeId});
    if(r.ok){
      const dados = r.dados;
      contrato.obra.real = true;
      contrato.obra.percentualGeral = Math.round(dados.percentualGeral || 0);
      contrato.obra.previsao = dados.dataEntregaPrevista ? formatarDataMesAno(dados.dataEntregaPrevista) : 'em breve';
      contrato.obra.previsaoTexto = dados.dataEntregaPrevista
        ? 'Conclusão da obra prevista para '+formatarDataMesAno(dados.dataEntregaPrevista)
        : (dados.etapaAtual? 'Etapa atual: '+dados.etapaAtual : 'Ainda sem previsão cadastrada');
      contrato.obra.etapaAtual = dados.etapaAtual || '';
      contrato.obra.etapas = [];
      contrato.obra.comunicados = (dados.atualizacoes||[]).map(a=>({
        data: formatarDataBr(a.data),
        etapa: a.etapa,
        pct: Math.round(a.percentual||0),
        titulo: 'Atualização: '+a.etapa+' · '+Math.round(a.percentual||0)+'%',
        resumo: a.observacoes || 'Avanço registrado pelo time de obra.'
      }));
    }
  }catch(e){ /* mantem o mock se a rede falhar */ }
  contrato.obra.carregando = false;
  renderSeApp();
}
/* Boletos reais (CA_Boleto__c). "Atrasado" e' calculado no backend (Pendente com vencimento no passado). */
async function carregarFinanceiroReal(contrato){
  if(!contrato.oportunidadeId) return;
  try{
    const r = await chamarProxy('/api/financeiro', {oportunidadeId: contrato.oportunidadeId});
    if(!r.ok || !Array.isArray(r.dados.boletos)) return;
    contrato.parcelas = r.dados.boletos.map(b => ({
      id:'boleto-'+b.numeroParcela,
      desc:'Parcela '+b.numeroParcela,
      valor: b.valor,
      vencimento: formatarDataBr(b.vencimento),
      dataPagamento: b.dataPagamento? formatarDataBr(b.dataPagamento) : null,
      status: b.status,
      codigoBarras: b.codigoBarras || null,
      pix: b.pixCopiaECola || null
    }));
    contrato.financeiroReal = true;
    if(r.dados.valorTotalContrato) contrato.contrato.valor = r.dados.valorTotalContrato;
  }catch(e){ /* mantem o mock */ }
  renderSeApp();
}

/* ---------- derivados usados em varias telas ---------- */
const MESES_ABREV = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const MESES_EXT = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const TONE = {Pago:'success', Aprovado:'success', 'Concluído':'success', Atrasado:'danger', 'Indisponível':'neutral', Pendente:'warning', 'Em andamento':'sky', 'Em análise':'sky', Novo:'sky'};
const STATUS_LABEL = {Pago:'Pago', Aprovado:'Recebido', 'Concluído':'Resolvido', Atrasado:'Em atraso', 'Indisponível':'Em breve', Pendente:'Falta enviar', 'Em andamento':'Em andamento', 'Em análise':'Em análise'};
const tone = st => TONE[st] || 'neutral';
const statusLabel = st => STATUS_LABEL[st] || st;
const toneVar = t => ({success:'var(--success)', danger:'var(--danger)', warning:'var(--warning)', sky:'var(--accent)'})[t] || 'var(--border)';
function parcelaView(p){
  const emAnalise = !!p.comprovante && p.status!=='Pago';
  return {
    ...p,
    tone: p.status==='Pendente' ? 'warning' : tone(p.status),
    label: p.status==='Pendente' ? 'A vencer' : statusLabel(p.status),
    dot: toneVar(p.status==='Pendente' ? 'warning' : tone(p.status)),
    aberta: p.status!=='Pago' && !p.comprovante,
    emAnalise,
    sub: emAnalise ? 'Comprovante em análise' : p.status==='Pago' ? (p.dataPagamento ? 'Pago em '+p.dataPagamento : 'Pago') : p.status==='Atrasado' ? 'Venceu em '+p.vencimento : 'Vence em '+p.vencimento
  };
}
/* Contexto da unidade ativa: etapa da jornada, parcelas, docs, fase (pre/pos-entrega), prazos. */
function ctx(){
  const c = contratoAtivo();
  const etapas = c.jornada.etapas;
  const idx = etapas.findIndex(e=>e.status==='atual');
  const etapaNome = idx>=0 ? etapas[idx].nome : 'Concluído';
  const prox = c.parcelas.find(p=>p.status==='Pendente') || c.parcelas.find(p=>p.status!=='Pago');
  const atrasadas = c.parcelas.filter(p=>p.status==='Atrasado');
  const docsPend = c.documentosReal ? [] : c.documentos.filter(d=>d.status==='Pendente');
  const pagas = c.parcelas.filter(p=>p.status==='Pago');
  const emVistoria = etapaNome==='Vistoria' || (etapaNome==='Obra' && c.obra.percentualGeral>=60);
  const emEntrega = etapaNome==='Entrega das chaves' || state.vi.step==='assinada';
  const partes = (c.obra.previsao||'').split('/');
  const iMes = MESES_ABREV.indexOf(partes[0]);
  const prevDate = iMes>=0 ? new Date(parseInt(partes[1],10), iMes, 1) : null;
  const enDias = prevDate ? Math.max(0, Math.round((prevDate - new Date())/86400000)) : 0;
  return {c, etapas, idx, etapaNome, fasePos: etapaNome==='Pós-entrega', prox, atrasadas, docsPend, pagas, emVistoria, emEntrega, prevDate, iMes, prevAno: partes[1]||'', enDias};
}
/* Regra "Sua proxima acao" (README): a primeira verdadeira vence. Mantida aqui, num lugar so'. */
function proximaAcao(){
  const x = ctx();
  if(x.atrasadas.length) return 'atraso';
  if(x.emEntrega) return 'entrega';
  if(x.emVistoria) return 'vistoria';
  if(x.prox && x.prox.status!=='Pago') return 'parcela';
  if(x.docsPend.length) return 'documento';
  return 'nada';
}

/* ---------- pos-venda (Salesforce): vistoria, entrega, garantias, personalizacao, indicacao, convites, avisos ---------- */
const ETAPAS_JORNADA = ['Compra','Financeiro','Financiamento','Obra','Vistoria','Entrega das chaves','Pós-entrega'];
function jornadaDe(etapaAtual){
  const idx = Math.max(0, ETAPAS_JORNADA.indexOf(etapaAtual));
  return ETAPAS_JORNADA.map((nome,i)=>({nome, status: i<idx?'concluida': i===idx?'atual':'pendente'}));
}
function fmtPctBr(n){ return String(n).replace('.',',')+'%'; }
/* Pode o usuario agir (pagar, abrir pedido, agendar...)? Co-comprador "Acompanhar" so' olha. */
function podeAgir(c){
  c = c || contratoAtivo();
  if(c.permissao === 'Acompanhar'){ toast('Seu acesso a este imóvel é só para acompanhar.'); return false; }
  return true;
}
/* Agenda: proximas datas oferecidas (Salesforce) - no demo, geradas aqui do mesmo jeito (hoje+3, sem domingos). */
function slotsLocais(){
  const out = []; const d = new Date(); d.setDate(d.getDate()+3);
  const abrev = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  while(out.length<6){
    if(d.getDay()!==0){
      const iso = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      out.push({iso, dia:abrev[d.getDay()], num:String(d.getDate()).padStart(2,'0'), mes:String(d.getMonth()+1)});
    }
    d.setDate(d.getDate()+1);
  }
  return out;
}
function slotsAtivos(){ const c = contratoAtivo(); return (c.pv && c.pv.slots) ? c.pv.slots : {datas:slotsLocais(), horasVistoria:['09:00','10:30','14:00','15:30'], horasEntrega:['09:00','11:00','14:00','16:00']}; }

  const r = await chamarProxy('/api/pos-venda', {oportunidadeId:c.oportunidadeId, acao, dados: dados||undefined});

  try{ const r = await chamarProxy('/api/pos-venda', {oportunidadeId:c.oportunidadeId, acao:'estado'}); if(r.ok) aplicarEstado(c, r.dados); }catch(e){ /* mantem o que tinha */ }

function aplicarEstado(c, e){
  c.pv = e; c.posVendaReal = true;
  c.jornada.etapas = jornadaDe(e.etapaAtual);
  if(e.reajuste && e.reajuste.percentual!=null){
    c.incc = {ultimoReajuste:fmtPctBr(e.reajuste.percentual), dataReajuste:formatarDataBr(e.reajuste.data), indice:e.reajuste.indice||'INCC'};
    c.temIncc = true;
  } else c.temIncc = false;
  if(c.id===state.contratoAtivo) sincronizarEstadoLocal(c);
  renderSeApp();
}
/* Espelha o estado do Salesforce nos objetos que as telas ja usam (state.vi / en / pz / pessoas / prefs). */
function sincronizarEstadoLocal(c){
  const e = c.pv; if(!e) return;
  const v = e.vistoria;
  if(v && v.status==='Assinada') state.vi = {...state.vi, step:'assinada'};
  else if(v && v.status==='Agendada') state.vi = {step: state.vi.step==='checklist'?'checklist':'agendada', data:slotDe(v.agenda), hora:v.agenda.hora, check:state.vi.check};
  else state.vi = {step:'agendar', data:null, hora:'', check:{}};
  const en = e.entrega;
  if(en && (en.status==='Agendada' || en.status==='Realizada')) state.en = {step:'agendada', data:slotDe(en.agenda), hora:en.agenda.hora, check:en.checklist||{}};
  else state.en = {step:'agendar', data:null, hora:'', check:state.en.check||{}};
  const pz = e.personalizacao;
  state.pz = {sel:{...(pz.escolhas||{})}, confirmado:!!pz.confirmada};
  state.pessoas = (e.pessoas||[]).map(p=>({id:p.id, nome:p.nome, sub:p.sub, titular:!!p.titular, status:p.status}));
  state.prefs = {...e.prefs};
}
const slotDe = ag => ag ? {iso:ag.data, dia:ag.dia, num:ag.num, mes:ag.mes} : null;

function lerArquivoComoBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve((reader.result || '').split(',')[1] || '');
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}


async function baixarDocumentoReal(contentVersionId){
  const c = contratoAtivo();
  const doc = c.documentos.find(d=>d.contentVersionId===contentVersionId);
  const nomeArquivo = doc? doc.nome : 'documento';
  const tipoArquivo = doc? doc.tipoArquivo : '';
  toast('Baixando documento...');
  try{
    const resp = await fetch(BUYERCARE_API_BASE + '/api/documento-arquivo', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({oportunidadeId: c.oportunidadeId, contentVersionId})
    });
    const dados = await resp.json();
    if(!resp.ok || dados.erro || !dados.conteudoBase64){
      toast('Não foi possível baixar o documento.');
      return;
    }
    const mime = {PDF:'application/pdf', JPG:'image/jpeg', JPEG:'image/jpeg', PNG:'image/png'}[(dados.tipoArquivo||'').toUpperCase()] || 'application/octet-stream';
    const bytes = atob(dados.conteudoBase64);
    const arr = new Uint8Array(bytes.length);
    for(let i=0;i<bytes.length;i++) arr[i] = bytes.charCodeAt(i);
    const blob = new Blob([arr], {type: mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = nomeArquivo + (tipoArquivo? '.'+tipoArquivo.toLowerCase() : '');
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(e){
    toast('Falha de conexão ao baixar o documento.');
  }
}

function copiarTexto(texto, msgOk){
  const falha = () => toast('Não foi possível copiar. Selecione o código manualmente.');
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(texto).then(()=>toast(msgOk), falha);
  else falha();
}
function copiarCodigoBarras(id){
  const p = contratoAtivo().parcelas.find(x=>x.id===id);
  if(!p || !p.codigoBarras){ toast('O código do boleto ainda não está disponível.'); return; }
  copiarTexto(p.codigoBarras, 'Código do boleto copiado');
}
/* Pix: o backend ainda nao guarda o "copia e cola" (CA_Boleto__c so' tem o codigo de barras). Nos
   contratos reais o botao primario copia o codigo do boleto; no demo continua "Copiar Pix". */
function pagarLabel(p){ return (!contratoAtivo().financeiroReal || (p && p.pix)) ? 'Copiar Pix' : 'Copiar boleto'; }
function pagarAcao(p){
  if(state.offline){ toast('Sem conexão. Conecte-se para pagar pelo app.'); return; }
  if(contratoAtivo().financeiroReal){
    if(p && p.pix) copiarTexto(p.pix, 'Código Pix copiado'); else copiarCodigoBarras(p.id);
    return;
  }
  toast('Código Pix copiado');
}

/* ---------- Informe de IR: um por ano-calendario, calculado a partir das parcelas pagas ---------- */
function irPorAno(c){
  const porAno = {};
  c.parcelas.filter(p=>p.status==='Pago').forEach(p=>{ const y = (p.dataPagamento||p.vencimento).slice(6); porAno[y] = (porAno[y]||0) + p.valor; });
  return porAno;
}
function baixarInformeIR(ano){
  const c = contratoAtivo();
  const pagas = c.parcelas.filter(p=>p.status==='Pago' && (p.dataPagamento||p.vencimento).slice(6)===String(ano));
  const total = pagas.reduce((s,p)=>s+p.valor,0);
  abrirJanelaImpressao('Informe para o Imposto de Renda '+ano,
    `${escHtml(c.contrato.empreendimento)} · ${escHtml(c.contrato.unidade)} · Comprador: ${escHtml(DB.comprador.nome)} · Total pago em ${ano}: <b>${brl(total)}</b>`,
    pagas.map(p=>`<tr><td>${escHtml(p.desc)}</td><td>${escHtml(p.dataPagamento||p.vencimento)}</td><td style="text-align:right">${brl(p.valor)}</td></tr>`).join('') + `<tr><td colspan="2"><b>Total</b></td><td style="text-align:right"><b>${brl(total)}</b></td></tr>`,

}

/* Cria o Case financeiro. Devolve {protocolo, caseId} ou null (e ja avisa o usuario). */
async function criarSolicitacaoFinanceira(assunto, descricao, parcelaInfo){
  const c = contratoAtivo();
  if(!podeAgir(c)) return null;
  if(!c.financeiroReal){ return {protocolo:'FIN-DEMO', caseId:null, demo:true}; }
  try{
    const r = await chamarProxy('/api/solicitacao-financeira', {oportunidadeId:c.oportunidadeId, assunto, descricao, parcelaInfo: parcelaInfo||undefined});
    if(!r.ok || !r.dados.protocolo){ toast('Não foi possível registrar a solicitação.'); return null; }
    return r.dados;
  }catch(e){ toast('Falha de conexão ao registrar a solicitação.'); return null; }
}
async function enviarSolicitacaoFinanceira(parcelaId){
  if(state.sfEnviando) return;
  const desc = (state.sfDesc||'').trim();
  if(!desc){ toast('Conte o que aconteceu antes de enviar.'); return; }
  const c = contratoAtivo();
  const parcela = parcelaId ? c.parcelas.find(p=>p.id===parcelaId) : null;
  const info = parcela ? `${parcela.desc} · ${brl(parcela.valor)} · Vencimento ${parcela.vencimento}` : '';
  state.sfEnviando = true; render();
  const r = await criarSolicitacaoFinanceira(state.sfAssunto, desc, info);
  state.sfEnviando = false;
  if(!r){ render(); return; }
  state.sfDesc = '';
  toast(r.demo ? 'Enviado. O financeiro responde em até 2 dias úteis.' : 'Solicitação '+r.protocolo+' enviada ao financeiro');
  goBack();
}

async function escolherComprovante(input){
  const f = (input.files||[])[0];
  if(!f) return;
  if(f.size > 8*1024*1024){ toast('O arquivo passa de 8MB. Escolha um menor.'); input.value=''; return; }
  state.comprovante.arquivo = {nome:f.name, tipo:(f.name.split('.').pop()||'').toLowerCase(), base64: await lerArquivoComoBase64(f)};
  input.value = '';
  render();
}
async function enviarComprovante(id){
  const cmp = state.comprovante;
  if(cmp.enviando) return;
  if(!cmp.arquivo){ toast('Anexe o comprovante antes de enviar.'); return; }
  const c = contratoAtivo();
  const p = c.parcelas.find(x=>x.id===id);
  cmp.enviando = true; render();
  const info = p ? `${p.desc} · ${brl(p.valor)} · Vencimento ${p.vencimento}` : '';
  const r = await criarSolicitacaoFinanceira('Comprovante de pagamento', 'O cliente informa que já pagou esta parcela'+(cmp.data?' em '+cmp.data:'')+' e enviou o comprovante em anexo. Conferir e dar baixa.', info);
  if(!r){ cmp.enviando = false; render(); return; }
  let anexoOk = true;
  if(r.caseId){
    const a = await chamarProxy('/api/atendimento-anexo', {oportunidadeId:c.oportunidadeId, caseId:r.caseId, nomeArquivo:cmp.arquivo.nome, tipoArquivo:cmp.arquivo.tipo, conteudoBase64:cmp.arquivo.base64}).catch(()=>({ok:false}));
    anexoOk = !!a.ok;
  }
  if(p) p.comprovante = true;
  state.comprovante = {arquivo:null, data:'', enviando:false};
  toast(anexoOk ? 'Comprovante recebido. Confirmamos em até 1 dia útil.' : 'Pedido registrado, mas o arquivo não subiu. Fale com o financeiro.');
  goBack();
}

/* ---------- Antecipar parcelas: simulacao local + pedido real (Case financeiro) ---------- */
function abrirAntecipar(){
  const x = ctx();
  if(x.atrasadas.length){ toast('Regularize a parcela em atraso para antecipar.'); return; }
  go('antecipar');
}
function antMudar(d){
  const n = contratoAtivo().parcelas.filter(p=>p.status==='Pendente').length;
  state.antQtd = Math.max(1, Math.min(n, state.antQtd + d));
  render();
}
function antSimulacao(){
  const c = contratoAtivo();
  const pend = c.parcelas.filter(p=>p.status==='Pendente');
  const qtd = Math.min(state.antQtd, Math.max(pend.length,1));
  const sel = pend.slice(0,qtd), pct = pctReajuste(c);
  return {pend, qtd, sel, total: sel.reduce((s,p)=>s+p.valor,0), econ: Math.round(sel.reduce((s,p,i)=>s+p.valor*(Math.pow(1+pct,i+1)-1),0))};
}

/* ---------- Avisos de obra (Web Push) ----------
   O aparelho se inscreve no servico de push do navegador e o Salesforce avisa (via Worker) quando
   sai uma atualizacao de obra no empreendimento. O push vai sem texto: o service worker mostra uma
   mensagem generica, entao nenhum dado do cliente passa pelo servico de push. */
const VAPID_PUBLIC_KEY = 'BAOfpCPo5uxktkZQKZRkuCnZ-ezdihN2W5GE3lkBRgr3EatTvbwu8dRatwRsH3XjoYAnf62cMDWO7YLIyaSSkCA';
const pushEstado = {
  suportado: ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window),
  inscrito: false, negado: false, ocupado: false, checado: false, erro: ''
};
function pushChaveParaBytes(b64u){
  const bin = atob(b64u.replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(b64u.length/4)*4,'='));
  return Uint8Array.from(bin, c=>c.charCodeAt(0));
}
async function pushVerificar(){
  if(!pushEstado.suportado || pushEstado.checado) return;
  pushEstado.checado = true;
  try{
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    pushEstado.inscrito = !!sub;
    pushEstado.negado = Notification.permission === 'denied';
    if(state.tab==='obra') renderSeApp();
  }catch(e){ pushEstado.suportado = false; }
}
async function pushRegistrar(endpoint, acao){
  const c = contratoAtivo();
  const r = await chamarProxy('/api/push-inscricao', {oportunidadeId: c.oportunidadeId, endpoint, acao});
  if(!r.ok) throw new Error(r.dados.erro || 'Falha ao registrar o aviso');
}
async function pushAlternar(){
  if(pushEstado.ocupado) return;
  const c = contratoAtivo();
  if(!c || !c.oportunidadeId){ toast('Os avisos de obra ficam disponíveis para contratos reais.'); return; }
  pushEstado.ocupado = true; pushEstado.erro = ''; render();
  try{
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(sub && pushEstado.inscrito){
      await pushRegistrar(sub.endpoint, 'cancelar');
      await sub.unsubscribe();
      pushEstado.inscrito = false;
      toast('Avisos de obra desativados');
    }else{
      const perm = await Notification.requestPermission();
      if(perm !== 'granted'){ pushEstado.negado = (perm === 'denied'); throw new Error('Permita as notificações para receber os avisos.'); }
      if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey: pushChaveParaBytes(VAPID_PUBLIC_KEY)});
      await pushRegistrar(sub.endpoint, 'inscrever');
      pushEstado.inscrito = true;
      toast('Avisos de obra ativados');
    }
  }catch(e){
    pushEstado.erro = e.message || 'Não foi possível alterar os avisos agora.';
  }
  pushEstado.ocupado = false;
  render();
}
function pushLinhaHtml(){
  if(!pushEstado.suportado) return '';
  const on = pushEstado.inscrito;
  const sub = pushEstado.erro ? escHtml(pushEstado.erro) : pushEstado.negado ? 'As notificações estão bloqueadas neste aparelho. Libere nas configurações do navegador.' : on ? 'Você recebe um aviso a cada atualização' : 'Um aviso no celular a cada novidade';
  return `<div class="card pad" style="padding:14px 16px;display:flex;align-items:center;gap:12px;">${icChip('bell','sun')}
    <span style="flex:1;min-width:0;"><b style="font-size:15px;display:block;">Avisar quando a obra avançar</b><span class="sm">${sub}</span></span>
    <button class="toggle ${on?'on':''}" role="switch" aria-checked="${on}" aria-label="Avisos de obra" onclick="pushAlternar()" ${pushEstado.ocupado||pushEstado.negado?'disabled':''}><i></i></button></div>`;
}

/* "Salvar na agenda": baixa um .ics (funciona em iOS/Android/desktop) */
function baixarAgenda(titulo, data, hora, minutos){
  if(!data || !hora){ toast('Marque a data primeiro.'); return; }
  const [hh,mm] = hora.split(':').map(Number);
  const ini = new Date(data.iso+'T'+hora+':00');
  const fim = new Date(ini.getTime() + (minutos||60)*60000);
  const f = d => d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'T'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+'00';
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Codeart//CodeLar//PT','BEGIN:VEVENT','UID:'+Date.now()+'@codelar','DTSTAMP:'+f(new Date())+'','DTSTART:'+f(ini),'DTEND:'+f(fim),'SUMMARY:'+titulo+' - '+contratoAtivo().contrato.empreendimento,'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ics], {type:'text/calendar'}));
  a.download = 'codelar-evento.ics';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast('Evento baixado — abra para salvar na agenda');
}

const NA_AMBIENTES = ['Sala','Cozinha','Banheiro','Suíte','Quarto','Varanda','Área de serviço','Outro'];
const NA_TIPOS = ['Vazamento ou infiltração','Elétrica','Porta ou janela','Piso ou parede','Pintura','Outro'];
const NA_PERIODOS = ['Manhã, dias de semana','Tarde, dias de semana','Sábado de manhã','Qualquer horário'];
/* CA_CategoriaDefeito__c e' uma picklist restrita (Hidraulica, Eletrica, Estrutural/Alvenaria, Esquadrias,
   Acabamento, Outros): o texto escolhido no app vai inteiro na descricao e a categoria vai mapeada. */
function categoriaBackend(tipo){
  const t = (tipo||'').toLowerCase();
  if(/vazamento|infiltr|impermeab|hidr|lou[cç]as|metais/.test(t)) return 'Hidráulica';
  if(/el[eé]tric/.test(t)) return 'Elétrica';
  if(/estrutura|funda/.test(t)) return 'Estrutural/Alvenaria';
  if(/porta|janela|esquadria|vidro/.test(t)) return 'Esquadrias';
  if(/piso|parede|revestimento|pintura|acabamento/.test(t)) return 'Acabamento';
  return 'Outros';
}
function naSet(campo, valor){ state.na[campo] = valor; render(); }
function naTogglePeriodo(p){ const a = state.na.periodos; const i = a.indexOf(p); if(i>=0) a.splice(i,1); else a.push(p); render(); }
function naProximo(){

async function naEscolherArquivos(input){
  for(const f of Array.from(input.files||[])){
    if(f.size > 8*1024*1024){ toast('"'+f.name+'" passa de 8MB e não foi anexado.'); continue; }
    state.na.anexos.push({nome:f.name, tipo:(f.name.split('.').pop()||'').toLowerCase(), base64: await lerArquivoComoBase64(f)});
  }
  input.value = '';
  render();
}

async function salvarNovoAtendimento(){
  const na = state.na, c = contratoAtivo();
  if(na.enviando) return;
  const tipoTexto = na.tipo || 'Outro';
  let descricao = (na.descricao||'').trim() || 'Sem descrição detalhada.';
  const extras = [];
  if(na.tipo) extras.push('Tipo informado: '+na.tipo);
  if(na.periodos.length) extras.push('Disponibilidade para visita: '+na.periodos.join('; '));
  if(extras.length) descricao += '\n\n' + extras.join('\n');
  na.enviando = true; render();

  if(c.atendimentoReal){
    try{
      const r = await chamarProxy('/api/atendimento-novo', {oportunidadeId:c.oportunidadeId, categoria:categoriaBackend(tipoTexto), ambiente:na.ambiente, descricao});
      if(!r.ok || !r.dados.protocolo){ toast('Não foi possível registrar a solicitação.'); na.enviando = false; render(); return; }
      let falhas = 0;
      if(r.dados.caseId){
        for(const a of na.anexos){
          const ra = await chamarProxy('/api/atendimento-anexo', {oportunidadeId:c.oportunidadeId, caseId:r.dados.caseId, nomeArquivo:a.nome, tipoArquivo:a.tipo, conteudoBase64:a.base64}).catch(()=>({ok:false}));
          if(!ra.ok) falhas++;
        }
      }
      if(falhas) toast(falhas+' anexo(s) não foram enviados');
      await carregarAtendimentoReal(c);
      state.ultimoProtocolo = r.dados.protocolo;
    }catch(e){ toast('Falha de conexão ao registrar a solicitação.'); na.enviando = false; render(); return; }
  } else {
    nextAtendimentoNum++;
    const novo = {id:'at'+Date.now(), protocolo:'AT-2026-0'+nextAtendimentoNum, tipo:tipoTexto, ambiente:na.ambiente||'Não informado', descricao, status:'Em andamento', sla:'Resposta em até 2 dias úteis', data:new Date().toLocaleDateString('pt-BR')};
    c.atendimentos.unshift(novo);
    state.ultimoProtocolo = novo.protocolo;
  }
  state.na = {step:1, ambiente:'', tipo:'', descricao:'', anexos:[], periodos:[], enviando:false};
  state.tab = 'ajuda';
  state.stacks.ajuda = [{screen:'ajuda'}, {screen:'atendimentoConfirmacao'}];
  render({resetScroll:true});
}

    <div class="stack">${DB.contratos.map(u=>{ const sel = u.id===state.contratoAtivo; return `<button onclick="selecionarUnidade('${u.id}')" style="border:2px solid ${sel?'var(--accent)':'var(--card-border)'};border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;background:var(--surface);text-align:left;width:100%;box-shadow:var(--card-shadow);min-height:64px;color:var(--text);"><span class="radio" style="width:22px;height:22px;border-color:${sel?'var(--accent)':'var(--border-strong)'};">${sel?'<i style="width:11px;height:11px;background:var(--accent);"></i>':''}</span><span style="flex:1;min-width:0;"><b class="disp" style="font-size:16px;display:block;">${escHtml(u.contrato.empreendimento)}</b><span class="sm">Unidade ${escHtml(u.contrato.unidade)} · ${escHtml(etapaAtualLabel(u).replace('Etapa atual: ',''))}</span></span></button>`; }).join('')}</div>`;
  return {title:'Minhas unidades', body};
}

/* ---------- Chat com o Arti (assistente virtual) ---------- */
function respostaAgenteLocal(pergunta){
  const p = pergunta.toLowerCase();
  const x = ctx(), c = x.c;
  const rot = DB.contratos.length>1 ? ` (${c.contrato.empreendimento} · ${c.contrato.unidade})` : '';
  if(p.includes('próxima parcela') || p.includes('vence')){
    return x.prox ? `Sua próxima parcela em aberto${rot} é <b>${escHtml(x.prox.desc)}</b>, no valor de <b>${brl(x.prox.valor)}</b>, com vencimento em <b>${x.prox.vencimento}</b>.` : `Você não tem parcelas em aberto${rot} no momento. 🎉`;
  }
  if(p.includes('segunda via') || p.includes('boleto')) return 'Na demonstração eu não consigo gerar a 2ª via. Em produção, o time financeiro envia pra você.';
  if(p.includes('documentos')){
    return x.docsPend.length ? `Ainda falta enviar${rot}: <b>${x.docsPend.map(d=>escHtml(d.nome)).join(', ')}</b>.` : `Todos os seus documentos estão em dia${rot}. ✅`;
  }
  if(p.includes('obra') || p.includes('andamento')) return `A obra${rot} está com <b>${c.obra.percentualGeral}%</b> de evolução geral, com previsão de conclusão em <b>${escHtml(c.obra.previsao)}</b>.`;
  if(p.includes('vistoria')) return 'A vistoria abre quando a obra entra na reta final — você será avisado por aqui assim que der para marcar.';
  if(p.includes('assistência') || p.includes('assistencia')) return 'Posso te levar direto: toque em <b>Pedir assistência técnica</b> aqui na Ajuda.';
  return 'Entendi! Vou encaminhar essa solicitação para a equipe responsável e te aviso por aqui assim que houver uma atualização.';
}
function screenAgenteChat(){
  const body = `
    <div style="display:flex;flex-direction:column;gap:10px;padding-bottom:8px;">${state.chat.map(m=>`<div class="chat-bubble ${m.from==='bot'?'bot':'user'}">${m.html? m.text : escHtml(m.text)}</div>`).join('')}${state.chatEnviando?`<div class="chat-bubble bot" style="opacity:.7;">Digitando...</div>`:''}</div>
    <div style="display:flex;gap:8px;overflow-x:auto;padding:2px 16px 4px;margin:14px -16px 0;">${SUGESTOES.map(s=>`<button onclick="perguntarAgente('${jsq(s)}')" style="flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface);font-size:14px;font-weight:600;color:var(--text);cursor:pointer;white-space:nowrap;">${s}</button>`).join('')}</div>
    <form onsubmit="enviarMensagemAgente(event)" style="display:flex;gap:8px;margin-top:14px;">
      <input class="inp" id="chatInput" autocomplete="off" maxlength="500" placeholder="Escreva sua pergunta..." ${state.chatEnviando?'disabled':''} style="flex:1;min-width:0;border-radius:999px;min-height:48px;padding:0 18px;">
      <button type="submit" aria-label="Enviar" ${state.chatEnviando?'disabled':''} style="width:48px;height:48px;border-radius:50%;border:none;cursor:pointer;background:var(--primary-bg);color:var(--primary-text);display:flex;align-items:center;justify-content:center;flex:0 0 auto;">${ic('arrow',20,2.2)}</button></form>`;
  return {title:'Arti · Ajuda', body, depois: ()=>{ if(state.chatRolar){ state.chatRolar=false; rolarFim(); const i=document.getElementById('chatInput'); if(i && !i.disabled) i.focus(); } }};
}
function enviarMensagemAgente(ev){
  ev.preventDefault();
  const input = document.getElementById('chatInput');
  const texto = input.value.trim();
  if(!texto || state.chatEnviando) return;
  perguntarAgente(texto);
}
async function perguntarAgente(texto){
  const c = contratoAtivo();
  if(state.chatEnviando) return;
  if(!c.oportunidadeId){
    state.chat.push({from:'user', text:texto});
    state.chat.push({from:'bot', text:respostaAgenteLocal(texto), html:true});
    state.chatRolar = true; render();
    return;
  }
  const historico = state.chat.slice(-6).map(m=>({from:m.from, text:m.html? m.text.replace(/<[^>]+>/g,'') : m.text}));
  state.chat.push({from:'user', text:texto});
  state.chatEnviando = true; state.chatRolar = true; render();
  try{
    const r = await chamarProxy('/api/agente', {oportunidadeId:c.oportunidadeId, mensagem:texto, historico});
    state.chat.push({from:'bot', text: (r.ok && r.dados.resposta) ? r.dados.resposta : 'Não consegui responder agora. Tente de novo em instantes ou abra um pedido em Ajuda.'});
    if(r.ok && r.dados.encaminhado) carregarAtendimentoReal(c);
  }catch(e){
    state.chat.push({from:'bot', text:'Sem conexão com o servidor no momento. Tente novamente.'});
  }
  state.chatEnviando = false; state.chatRolar = true; render();
}

/* ---------- Indique um amigo ----------
   Contratos reais: codigo do comprador (Contact.CA_CodigoIndicacao__c), bonus (CA_BuyerCareConfig__mdt) e
   a lista de indicados (Lead com o mesmo codigo) vem do Salesforce; "Indicar agora" cria o Lead.
   Demo: tudo local. */
const IND_DEMO = {bonusIndicador:3000, bonusIndicado:5000, indicacoes:[{nome:'Carla Menezes', sub:'Visitou o Bosque Ipê em 20/09', status:'Em negociação', tone:'sky'},{nome:'Rafael Souza', sub:'Contrato assinado em 05/06', status:'Crédito liberado', tone:'success'}]};
function indicacaoDe(c){
  if(c.pv && c.pv.indicacao){ const i = c.pv.indicacao; return {codigo:i.codigo, bonusIndicador:i.bonusIndicador, bonusIndicado:i.bonusIndicado, indicacoes:i.indicacoes||[]}; }
  return {codigo:'MARCOS'+c.contrato.unidade.replace(/\D/g,'').slice(-4), ...IND_DEMO};
}
function compartilharIndicacao(){
  const c = contratoAtivo(), i = indicacaoDe(c);
  const texto = `Comprei meu imóvel com a Codeart e recomendo! Use meu código ${i.codigo} quando falar com eles.`;
  window.open('https://wa.me/?text='+encodeURIComponent(texto), '_blank', 'noopener');
}
state.ind = {nome:'', tel:'', enviando:false};
async function indicarAgora(){
  const c = contratoAtivo(), ind = state.ind;
  if(ind.enviando) return;
  if(!ind.nome.trim() || ind.tel.replace(/\D/g,'').length<10){ toast('Preencha o nome e o celular com DDD do seu amigo.'); return; }
  if(!podeAgir(c)) return;
  if(c.oportunidadeId){
    ind.enviando = true; render();
    const e = await chamarPosVenda(c, 'indicacao-criar', {nome:ind.nome.trim(), telefone:ind.tel.trim()});
    ind.enviando = false;
    if(!e){ render(); return; }
  } else {
    IND_DEMO.indicacoes.unshift({nome:ind.nome.trim(), sub:'Indicado agora', status:'Em contato', tone:'sky'});
  }
  state.ind = {nome:'', tel:'', enviando:false};
  toast('Indicação enviada. A Codeart entra em contato com o seu amigo.');
  render();
}
function screenIndicar(){
  const c = contratoAtivo(), i = indicacaoDe(c), ind = state.ind;
  const body = `
    <div class="card dark lg" style="padding:22px 20px;"><span class="ring" style="top:-50px;right:-50px;width:150px;height:150px;border-width:20px;"></span>
      <p class="eyebrow m0" style="color:#CBD1D5;position:relative;">Indique e ganhe</p>
      <h2 class="h2 big" style="margin:8px 0 6px;position:relative;color:#F2F2F2;">${i.bonusIndicador?brl(i.bonusIndicador)+' de crédito nas suas parcelas':'Indique um amigo'}</h2>
      <p style="margin:0;font-size:14px;color:#CBD1D5;line-height:1.5;position:relative;">Para cada amigo que fechar um imóvel com a Codeart.${i.bonusIndicado?' Seu amigo ganha '+brl(i.bonusIndicado)+' de desconto na entrada.':''}</p></div>
    <div class="card pad" style="padding:16px 18px;">${eyebrow('Seu código','" style="margin-bottom:8px')}<div style="display:flex;align-items:center;gap:10px;"><span class="disp" style="flex:1;font-size:26px;letter-spacing:.08em;">${escHtml(i.codigo||'—')}</span><button class="btn btn-secondary auto" style="min-height:40px;padding:0 14px;font-size:14px;" onclick="copiarTexto('${jsq(i.codigo||'')}','Código copiado')">Copiar</button></div></div>
    ${btn('Compartilhar pelo WhatsApp','compartilharIndicacao()','btn-primary','lg')}
    ${eyebrow('Ou indique agora','mt')}
    <div class="card pad" style="padding:16px;">
      <div class="field" style="margin-bottom:12px;"><label class="lb" for="ind-nome">Nome do seu amigo</label><input class="inp" id="ind-nome" value="${escHtml(ind.nome)}" oninput="state.ind.nome=this.value"></div>
      <div class="field" style="margin-bottom:14px;"><label class="lb" for="ind-tel">Celular com DDD</label><input class="inp" id="ind-tel" inputmode="tel" placeholder="(00) 00000-0000" value="${escHtml(ind.tel)}" oninput="state.ind.tel=this.value"></div>
      ${btn(ind.enviando?'Enviando...':'Indicar','indicarAgora()','btn-secondary')}</div>
    ${eyebrow('Suas indicações','mt')}
    ${i.indicacoes.length ? `<div class="card">${i.indicacoes.map(x=>`<div class="row" style="cursor:default;"><span class="disp" style="width:40px;height:40px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:14px;flex:0 0 auto;">${escHtml(x.nome.split(' ').map(p=>p[0]).slice(0,2).join(''))}</span><span class="grow"><b style="font-size:15px;display:block;">${escHtml(x.nome)}</b><span class="sm">${escHtml(x.sub)}</span></span>${badge(x.tone,escHtml(x.status))}</div>`).join('')}</div>`
      : `<p class="sm">Você ainda não indicou ninguém.</p>`}
    <p class="sm" style="margin:12px 0 0;">O crédito entra na parcela seguinte à assinatura do contrato do seu amigo. Consulte o regulamento.</p>`;
  return {title:'Indique um amigo', body};

/* ---------- Quem mais acessa ----------
   Contratos reais: convites em CA_ConviteAcesso__c; o CPF precisa constar no contrato (conferido no
   Salesforce); o convidado entra com o proprio e-mail. Demo: lista local. */
function convPerm(p){ state.conv.perm = p; render(); }
async function removerPessoa(i){
  const c = contratoAtivo(), p = state.pessoas[i];
  if(!podeAgir(c) || !p) return;
  if(c.oportunidadeId){
    const e = await chamarPosVenda(c, 'convite-remover', {conviteId:p.id});
    if(!e) return;
  } else { state.pessoas.splice(i,1); }
  toast('Acesso removido'); render();
}
async function convidar(){
  const cv = state.conv, c = contratoAtivo();
  if(cv.enviando) return;
  if(!cv.nome.trim() || cv.cpf.replace(/\D/g,'').length<11){ toast('Preencha nome e CPF completos.'); return; }
  if(!podeAgir(c)) return;
  const permissao = cv.perm==='tudo' ? 'Acompanhar e agir' : 'Acompanhar';
  if(c.oportunidadeId){
    cv.enviando = true; render();
    const e = await chamarPosVenda(c, 'convite-criar', {nome:cv.nome.trim(), cpf:cv.cpf, permissao});
    cv.enviando = false;
    if(!e){ render(); return; }
  } else {
    state.pessoas.push({nome:cv.nome.trim(), sub: cv.perm==='tudo'?'Pode ver tudo e agir':'Pode acompanhar', status:'pendente'});
  }
  state.conv = {nome:'', cpf:'', perm:'ver', enviando:false};
  toast('Convite enviado por e‑mail'); render();
}
function screenCoComprador(){
  const cv = state.conv, c = contratoAtivo();
  const souTitular = !c.permissao || c.permissao==='Titular';
  const body = `
    <p class="muted" style="margin:0 0 16px;line-height:1.5;font-size:15px;">Compartilhe o acompanhamento com quem comprou junto com você. Cada pessoa entra com o próprio login; só o titular pode remover acessos.</p>
    <div class="card">${state.pessoas.map((p,i)=>`<div class="row" style="cursor:default;min-height:68px;"><span class="disp" style="width:44px;height:44px;border-radius:50%;background:${p.titular?'#303E47':'var(--accent-soft)'};color:${p.titular?'var(--sun)':'var(--accent)'};display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto;">${escHtml(p.nome.split(' ').map(x=>x[0]).slice(0,2).join(''))}</span><span class="grow"><b style="font-size:15px;display:block;">${escHtml(p.nome)}</b><span class="sm" style="display:block;">${escHtml(p.sub||'')}</span></span>${p.titular?badge('charcoal','Titular'):''}${p.status==='pendente'?badge('warning','Convite enviado'):''}${(!p.titular && souTitular)?`<button class="btn btn-danger-link" onclick="removerPessoa(${i})">Remover</button>`:''}</div>`).join('')}</div>
    ${(state.pessoas.length<3 && souTitular) ? `${eyebrow('Convidar')}<div class="card pad" style="padding:16px;">
      <div class="field" style="margin-bottom:12px;"><label class="lb" for="cv-nome">Nome</label><input class="inp" id="cv-nome" placeholder="Como está no contrato" value="${escHtml(cv.nome)}" oninput="state.conv.nome=this.value"></div>
      <div class="field" style="margin-bottom:12px;"><label class="lb" for="cv-cpf">CPF</label><input class="inp" id="cv-cpf" inputmode="numeric" placeholder="000.000.000-00" value="${escHtml(cv.cpf)}" oninput="state.conv.cpf=this.value"></div>
      <label class="lb">O que essa pessoa pode fazer</label>
      <div class="stack" style="margin-bottom:16px;">${[['ver','Acompanhar','Vê obra, parcelas e documentos'],['tudo','Acompanhar e agir','Também paga, envia documentos e abre pedidos']].map(([k,label,sub])=>`<button class="choice ${cv.perm===k?'on':''}" onclick="convPerm('${k}')"><span class="radio">${cv.perm===k?'<i></i>':''}</span><span><b style="font-size:15px;display:block;">${label}</b><span class="sm" style="font-weight:400;">${sub}</span></span></button>`).join('')}</div>
      <p class="sm" style="margin:0 0 14px;">Só aceitamos pessoas que constam no contrato. Conferimos o CPF com o cadastro da Codeart antes de liberar.</p>
      ${btn(cv.enviando?'Enviando...':'Enviar convite','convidar()','btn-primary','lg')}</div>` : ''}`;
  return {title:'Quem mais acessa', body};
}
