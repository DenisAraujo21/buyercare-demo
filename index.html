<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Codeart CodeLar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Outfit:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<!-- PWA: instalar na tela de inicio e abrir 100% em tela cheia, sem barra de navegador -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#303e47">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CodeLar">
<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
  if (window.navigator && window.navigator.standalone === true) {
    document.documentElement.classList.add('standalone-app');
  }
</script>
<style>
  :root{
    --bg:#f2f2f2; --surface:#ffffff; --surface-2:#eaeced; --border:#dadcde;
    --text:#303e47; --text-muted:#59656c;
    --accent:#416072; --accent-contrast:#ffffff; --sun:#fed600;
    --status-available:#257a4c; --status-reserved:#96661d; --status-sold:#b1524b;
    --shadow: 0 16px 40px -18px rgba(48,62,71,.28);
    --chrome-bg:#303e47; --chrome-bg-2:#416072; --chrome-text:#f2f2f2;
    --chrome-text-muted:rgba(242,242,242,.62); --chrome-accent:#6cc0ed; --chrome-border:rgba(255,255,255,.1);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1a2126; --surface:#232b31; --surface-2:#2c363d; --border:#3b454d;
      --text:#f2f2f2; --text-muted:#bdc6cc;
      --accent:#6cc0ed; --accent-contrast:#1a2126; --sun:#fed600;
      --status-available:#4cc287; --status-reserved:#e0ac4a; --status-sold:#e2726c;
      --shadow: 0 16px 40px -18px rgba(0,0,0,.6);
    }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'Outfit',-apple-system,BlinkMacSystemFont,sans-serif; -webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Poppins',-apple-system,sans-serif;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}
  button{font:inherit; color:inherit;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

  .stage{height:100%; display:flex; align-items:center; justify-content:center; padding:16px; background:
    radial-gradient(circle at 20% 15%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 45%),
    radial-gradient(circle at 85% 80%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 45%),
    var(--bg);
  }
  .rig{position:relative; height:100%; display:flex; align-items:center;}
  .bezel{display:none;}
  .device{
    width:min(calc(100vw - 32px), 404px); aspect-ratio:9/19.5; max-height:100%;
    background:var(--surface); position:relative; display:flex; flex-direction:column;
    overflow:hidden; border-radius:32px; box-shadow:var(--shadow);
  }
  @media (min-width:660px){
    .stage{padding:36px 16px;}
    .bezel{display:block; position:absolute; inset:-12px -12px -12px -12px; border-radius:52px; background:linear-gradient(160deg,#20263c,#0a0d17); box-shadow:var(--shadow), 0 0 0 1px rgba(255,255,255,.04) inset;}
    .device{border-radius:40px; box-shadow:0 0 0 2px rgba(255,255,255,.05) inset;}
    .notch{display:block;}
  }
  .notch{display:none; position:absolute; top:10px; left:50%; transform:translateX(-50%); width:104px; height:22px; background:#0a0d17; border-radius:12px; z-index:80;}

  /* modo instalado (PWA) - a tela ja e o celular de verdade, entao tira a moldura
     de "cartao simulando celular" e preenche 100% ponta a ponta */
  @media (display-mode: standalone), (display-mode: fullscreen){
    .stage{padding:0;}
    .device{width:100vw; max-width:none; height:100%; border-radius:0; box-shadow:none;}
    .bezel{display:none !important;}
    .notch{display:none !important;}
    .appbar{padding-top:calc(env(safe-area-inset-top,0px) + 14px);}
    .tabbar{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8px);}
    .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 78px);}
    .fab-agente{bottom:calc(env(safe-area-inset-bottom,0px) + 82px);}
  }
  html.standalone-app .stage{padding:0;}
  html.standalone-app .device{width:100vw; max-width:none; height:100%; border-radius:0; box-shadow:none;}
  html.standalone-app .bezel{display:none !important;}
  html.standalone-app .notch{display:none !important;}
  html.standalone-app .appbar{padding-top:calc(env(safe-area-inset-top,0px) + 14px);}
  html.standalone-app .tabbar{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8px);}
  html.standalone-app .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 78px);}
  html.standalone-app .fab-agente{bottom:calc(env(safe-area-inset-bottom,0px) + 82px);}

  /* padding-top do appbar SEM safe-area por padrao: rodando dentro do Safari (nao
     instalado), o proprio navegador ja reserva o espaco do notch/dynamic island com
     a sua propria barra - se a gente tambem soma env(safe-area-inset-top) aqui, o
     espaco fica contado em dobro e o cabecalho aparece gigante (foi o que o Denis
     viu). So somamos esse inset de verdade quando o app roda instalado em tela
     cheia (acima), onde ai sim nao existe mais barra nenhuma do navegador. */
  .appbar{flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:14px 14px 12px; background:var(--chrome-bg); border-bottom:1px solid var(--chrome-border); position:relative; z-index:20;}
  .appbar h1{margin:0; font-size:17px; font-weight:700; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--chrome-text);}
  .iconbtn{width:34px; height:34px; border-radius:10px; border:none; background:transparent; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--chrome-text); flex:0 0 auto;}
  .iconbtn[hidden]{display:none !important;} /* mesmo caso do .fab-agente: regra de author com display:flex vence [hidden] do browser */
  .iconbtn:hover{background:rgba(255,255,255,.1);}
  .iconbtn svg{width:20px; height:20px;}
  .header-action{flex:0 0 auto; display:flex; gap:6px;}

  #view{flex:1 1 auto; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; position:relative;}
  .screen{padding:16px 16px 28px; animation:rise .22s ease both;}
  @keyframes rise{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

  .tabbar{flex:0 0 auto; display:flex; justify-content:space-around; background:var(--chrome-bg); border-top:1px solid var(--chrome-border); padding:8px 4px 8px; position:relative; z-index:20;}
  .tab-btn{background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--chrome-text-muted); cursor:pointer; padding:4px 8px; border-radius:10px; min-width:52px;}
  .tab-btn svg{width:20px; height:20px;}
  .tab-btn span{font-size:10px; font-weight:600; letter-spacing:.01em;}
  .tab-btn.active{color:var(--chrome-accent);}

  .home-indicator{position:absolute; bottom:6px; left:50%; transform:translateX(-50%); width:120px; height:4px; border-radius:2px; background:var(--text); opacity:.22; z-index:60; pointer-events:none;}

  p{line-height:1.5;}
  .muted{color:var(--text-muted);}
  .eyebrow{font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--text-muted);}
  .section-title{font-size:15px; font-weight:700; margin:22px 0 10px; display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .section-title:first-child{margin-top:0;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:16px;}
  .list-card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:13px 14px; display:flex; gap:12px; align-items:center; cursor:pointer; width:100%; text-align:left;}
  .list-card + .list-card{margin-top:10px;}
  .list-card:hover{border-color:color-mix(in srgb, var(--accent) 40%, var(--border));}
  .stack{display:flex; flex-direction:column; gap:10px;}

  .avatar{width:42px; height:42px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-weight:700; font-family:'Poppins',sans-serif; color:var(--accent); flex:0 0 auto; font-size:14px;}
  .avatar.icon{color:var(--accent);}
  .avatar.icon svg{width:20px; height:20px;}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:12px; padding:13px 18px; font-weight:600; font-size:14.5px; border:1px solid transparent; cursor:pointer; width:100%;}
  .btn svg{width:17px; height:17px;}
  .btn-primary{background:var(--chrome-bg); color:var(--chrome-text);}
  .btn-primary:hover{background:var(--chrome-bg-2);}
  .btn-primary:disabled{opacity:.4; cursor:not-allowed;}
  .btn-secondary{background:var(--surface-2); color:var(--text); border-color:var(--border);}
  .btn-ghost{background:transparent; color:var(--accent); padding:10px 6px; width:auto;}
  .btn-row{display:flex; gap:10px;}
  .btn-row .btn{width:auto; flex:1;}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--text-muted); margin-bottom:6px;}
  .field input, .field select, .field textarea{width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:11px; padding:11px 12px; font-size:14.5px; color:var(--text); font-family:inherit;}
  .field textarea{resize:vertical; min-height:70px;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1; min-width:0;}
  .field-row .field input, .field-row .field select{min-width:0;}

  .badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:4px 9px; border-radius:999px; letter-spacing:.01em; white-space:nowrap;}
  .badge-blue{background:color-mix(in srgb, var(--accent) 16%, transparent); color:var(--accent);}
  .badge-available{background:color-mix(in srgb, var(--status-available) 8%, transparent); color:var(--status-available);}
  .badge-reserved{background:color-mix(in srgb, var(--status-reserved) 6%, transparent); color:var(--status-reserved);}
  .badge-sold{background:color-mix(in srgb, var(--status-sold) 7%, transparent); color:var(--status-sold);}
  .dot{width:8px; height:8px; border-radius:50%; flex:0 0 auto;}
  .dot-available{background:var(--status-available);}
  .dot-reserved{background:var(--status-reserved);}
  .dot-sold{background:var(--status-sold);}

  .stats-row{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .stat-tile{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px; min-width:0;}
  .stat-tile .n{font-family:'IBM Plex Mono'; font-size:20px; font-weight:600; font-variant-numeric:tabular-nums;}
  .stat-ic svg{width:16px; height:16px;}
  .stat-tile .l{font-size:11px; color:var(--text-muted); margin-top:2px;}

  .quick-actions{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .quick-btn{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:8px; align-items:flex-start; cursor:pointer; min-width:0;}
  .quick-btn .ic{width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; background:color-mix(in srgb, var(--accent) 14%, transparent); color:var(--accent);}
  .quick-btn .ic svg{width:18px; height:18px;}
  .quick-btn b{font-size:13.5px;}

  .chip-row{display:flex; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch; scroll-snap-type:x proximity; padding-bottom:2px; margin-bottom:14px;}
  .chip{flex:0 0 auto; scroll-snap-align:start; padding:8px 13px; border-radius:999px; border:1px solid var(--border); background:var(--surface); font-size:12.5px; font-weight:600; color:var(--text-muted); cursor:pointer; white-space:nowrap;}
  .chip.active{background:var(--chrome-bg); border-color:var(--chrome-bg); color:var(--chrome-text);}

  .progressbar{height:6px; border-radius:99px; background:var(--surface-2); overflow:hidden;}
  .progressbar > i{display:block; height:100%; background:var(--accent); border-radius:99px;}

  .hero-panel{background:var(--chrome-bg); border-radius:18px; padding:20px 18px; margin-bottom:18px;}
  .hero-ring{
    --pct:0; flex:0 0 auto; width:56px; height:56px; border-radius:50%;
    background:conic-gradient(var(--chrome-accent) calc(var(--pct)*1%), rgba(255,255,255,.14) 0);
    display:flex; align-items:center; justify-content:center;
  }
  .hero-ring span{
    width:44px; height:44px; border-radius:50%; background:var(--chrome-bg);
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono'; font-size:12.5px; font-weight:600; color:var(--chrome-text);
  }
  /* botao "trocar de unidade" dentro do hero-panel (fundo escuro) e do card
     equivalente na aba Atendimento - mesmo estilo nos dois lugares, pra ficar claro
     que e a mesma acao */
  .unit-switch{
    all:unset; display:flex; align-items:center; gap:6px; cursor:pointer;
    margin-top:14px; padding-top:14px; border-top:1px solid var(--chrome-border);
    width:100%; box-sizing:border-box;
    font-size:12px; font-weight:600; color:var(--chrome-accent);
  }
  .unit-switch svg{width:15px; height:15px; flex:0 0 auto;}
  .unit-switch svg:last-child{margin-left:auto;}

  .kv-table{border:1px solid var(--border); border-radius:14px; overflow:hidden;}
  .kv-row{display:flex; justify-content:space-between; padding:11px 14px; font-size:13.5px; gap:10px;}
  .kv-row + .kv-row{border-top:1px solid var(--border);}
  .kv-row .k{color:var(--text-muted);}
  /* sem font-family mono aqui de proposito - as linhas de uma kv-table misturam datas,
     enderecos, status etc, e forcar todo mundo numa fonte monoespacada so pra alinhar
     numeros deixa o texto com "fonte estranha" no meio do resto do app (feedback do
     Denis). Mono continua so onde faz sentido (valores grandes em destaque: .mono,
     .stat-tile .n, .price-hero .amount). */
  .kv-row .v{font-weight:600; text-align:right;}

  .price-hero{background:var(--chrome-bg); border:1px solid var(--chrome-border); border-radius:16px; padding:16px; margin:14px 0;}
  .price-hero .label{color:var(--chrome-text-muted); font-size:12px;}
  .price-hero .amount{font-family:'IBM Plex Mono'; font-size:26px; font-weight:600; letter-spacing:-.01em; color:var(--chrome-accent);}

  .timeline{display:flex; flex-direction:column;}
  .tl-item{display:flex; gap:12px;}
  .tl-dot-wrap{display:flex; flex-direction:column; align-items:center;}
  .tl-dot{width:13px; height:13px; border-radius:50%; background:var(--border); flex:0 0 auto; margin-top:3px; display:flex; align-items:center; justify-content:center;}
  .tl-dot.done{background:var(--status-available);}
  .tl-dot.current{background:var(--accent); box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent);}
  .tl-line{width:2px; flex:1; background:var(--border); min-height:26px;}
  .tl-line.done{background:var(--status-available);}
  .tl-item:last-child .tl-line{display:none;}
  .tl-body{padding-bottom:22px; flex:1; min-width:0;}
  .tl-body b{font-size:13.5px; display:block;}
  .tl-body span{font-size:11.5px; color:var(--text-muted);}
  .tl-body.current b{color:var(--accent);}

  .radio-card{border:1px solid var(--border); border-radius:14px; padding:12px 14px; display:flex; align-items:center; gap:12px; cursor:pointer; background:var(--surface);}
  .radio-card + .radio-card{margin-top:8px;}
  .radio-card.sel{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 8%, var(--surface));}
  .radio-dot{width:18px; height:18px; border-radius:50%; border:2px solid var(--border); flex:0 0 auto; display:flex; align-items:center; justify-content:center;}
  .radio-card.sel .radio-dot{border-color:var(--accent);}
  .radio-card.sel .radio-dot::after{content:''; width:9px; height:9px; border-radius:50%; background:var(--accent);}

  .alert-card{display:flex; align-items:flex-start; gap:10px; background:color-mix(in srgb, var(--status-sold) 10%, var(--surface)); border:1px solid color-mix(in srgb, var(--status-sold) 32%, var(--border)); border-radius:14px; padding:12px 14px; margin-bottom:14px;}
  .alert-card svg{width:18px; height:18px; color:var(--status-sold); flex:0 0 auto; margin-top:1px;}
  .alert-card b{font-size:13.5px; color:var(--status-sold);}
  .alert-card.warn{background:color-mix(in srgb, var(--status-reserved) 10%, var(--surface)); border-color:color-mix(in srgb, var(--status-reserved) 32%, var(--border));}
  .alert-card.warn svg{color:var(--status-reserved);}
  .alert-card.warn b{color:var(--status-reserved);}
  .alert-card.info{background:color-mix(in srgb, var(--accent) 8%, var(--surface)); border-color:color-mix(in srgb, var(--accent) 30%, var(--border));}
  .alert-card.info svg{color:var(--accent);}
  .alert-card.info b{color:var(--accent);}
  .alert-card.success{background:color-mix(in srgb, var(--status-available) 10%, var(--surface)); border-color:color-mix(in srgb, var(--status-available) 32%, var(--border));}
  .alert-card.success svg{color:var(--status-available);}
  .alert-card.success b{color:var(--status-available);}

  .login-screen{min-height:100%; width:100%; box-sizing:border-box; background:var(--chrome-bg); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 28px; text-align:center;}
  .login-tagline{color:var(--chrome-text-muted); font-size:13px; margin:16px 0 0; max-width:270px; line-height:1.5;}
  .login-actions{width:100%; max-width:280px; margin-top:40px;}
  .btn-onlight{background:var(--chrome-text); color:var(--chrome-bg);}
  .btn-onlight:hover{background:#ffffff;}
  .login-footer{color:var(--chrome-text-muted); opacity:.6; font-size:10.5px; margin-top:32px; letter-spacing:.03em;}

  .empty{text-align:center; padding:40px 16px; color:var(--text-muted);}
  .empty svg{width:36px; height:36px; margin-bottom:10px; opacity:.5;}

  .toast{position:absolute; left:16px; right:16px; bottom:78px; background:var(--text); color:var(--bg); padding:12px 14px; border-radius:12px; font-size:13px; font-weight:600; box-shadow:var(--shadow); display:flex; align-items:center; gap:8px; z-index:90; opacity:0; transform:translateY(8px); pointer-events:none; transition:opacity .18s ease, transform .18s ease;}
  .toast.show{opacity:1; transform:none;}
  .toast svg{width:16px; height:16px; color:var(--status-available); flex:0 0 auto;}

  .success-badge{width:64px; height:64px; border-radius:50%; background:color-mix(in srgb, var(--status-available) 16%, transparent); display:flex; align-items:center; justify-content:center; margin:26px auto 16px;}
  .success-badge svg{width:30px; height:30px; color:var(--status-available);}

  .spinner{width:14px; height:14px; border-radius:50%; border:2px solid var(--border); border-top-color:var(--accent); animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* botao flutuante do agente virtual - acessivel de qualquer tela, acima da tabbar */
  .fab-agente{position:absolute; right:14px; bottom:82px; width:52px; height:52px; border-radius:50%; background:var(--chrome-accent); color:var(--chrome-bg); border:none; display:flex; align-items:center; justify-content:center; box-shadow:0 10px 24px -8px rgba(0,0,0,.4); cursor:pointer; z-index:40;}
  /* nossa propria regra de display:flex acima tem a mesma especificidade do [hidden]
     do navegador, mas como e uma regra "de autor" ela vence o [hidden] "de user-agent"
     por origem da cascata - sem isso o botao ficava visivel na tela de login mesmo
     com o atributo hidden aplicado */
  .fab-agente[hidden]{display:none !important;}
  .fab-agente svg{width:24px; height:24px;}

  /* obra: cartao de foto/comunicado mensal */
  .obra-photo{border-radius:14px; overflow:hidden; background:var(--chrome-bg); aspect-ratio:16/10; position:relative; display:flex; align-items:flex-end;}
  .obra-photo svg{width:100%; height:100%; display:block;}
  .obra-photo .tag{position:absolute; top:10px; left:10px; background:rgba(0,0,0,.4); color:#fff; font-size:9.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; padding:4px 8px; border-radius:999px;}

  /* etapa da obra: nome + barra de progresso */
  .obra-etapa{margin-bottom:14px;}
  .obra-etapa .row{display:flex; justify-content:space-between; font-size:13px; font-weight:600; margin-bottom:6px;}
  .obra-etapa .row span:last-child{font-family:'IBM Plex Mono'; color:var(--text-muted); font-weight:600;}

  /* chat do agente virtual */
  .chat-wrap{display:flex; flex-direction:column; gap:10px; padding-bottom:8px;}

function toast(msg){

/* ---------- navegacao (mesma arquitetura do CodeChave) ---------- */
function currentStack(){ return state.stacks[state.tab]; }
function currentScreen(){
  const top = currentStack()[currentStack().length-1];
  return SCREENS[top.screen](top.params||{});
}
function go(screen, params){
  currentStack().push({screen, params});
  render({resetScroll:true});
}
function replaceTop(screen, params){
  currentStack()[currentStack().length-1] = {screen, params};
  render({resetScroll:true});
}
function resetTabTo(screen, params){
  state.stacks[state.tab] = [{screen, params}];
  render({resetScroll:true});
}
function goBack(){
  if(currentStack().length>1){ currentStack().pop(); render({resetScroll:true}); }
}
function switchTab(tab){
  // tocar numa aba que ja esta ativa volta pro topo dela (padrao comum de app com
  // tabbar) - sem isso, se voce tivesse entrado fundo numa aba e tocasse nela de
  // novo esperando "resetar", nada acontecia, o que parecia um bug de navegacao
  if(state.tab===tab){ state.stacks[tab] = [state.stacks[tab][0]]; }
  state.tab = tab;
  state.agenteOpen = false;
  render({resetScroll:true});
}
/* O agente virtual e uma janela "por cima" do app, independente da pilha de
   navegacao de qualquer aba - antes ele era empurrado pra dentro da pilha da aba
   atual (igual um go() normal), e isso causava exatamente o bug que o Denis
   reportou: abrir o agente a partir de Documentos "grudava" a tela do agente no
   topo da pilha de Documentos, e tocar em Documentos de novo na tabbar so
   re-renderizava o topo da pilha (o proprio agente) em vez de voltar pra lista.
   Com o agente fora da pilha, abrir/fechar ele nunca mexe em qual tela cada aba
   estava mostrando. */
function abrirAgente(){
  state.agenteOpen = true;
  render();
}
function fecharAgente(){
  state.agenteOpen = false;
  render();
}
/* Trocar de unidade reinicia a pilha de todas as abas para a tela raiz - os dados
   mudam (financeiro, documentos, obra e atendimento passam a ser os da unidade
   escolhida), entao nao faz sentido manter uma tela de detalhe aberta (ex: parcela
   ou atendimento) que pertencia ao contrato anterior. A aba em que o usuario estava
   e mantida - se ele trocou de unidade a partir do Atendimento, por exemplo, volta
   pro Atendimento (agora da nova unidade), nao pro Início. */
function selecionarUnidade(id){
  if(id===state.contratoAtivo){ goBack(); return; }
  state.contratoAtivo = id;
  state.stacks = {
    inicio:[{screen:'inicio'}], financeiro:[{screen:'financeiroList'}], documentos:[{screen:'documentosList'}],
    obra:[{screen:'obraDetail'}], atendimento:[{screen:'atendimentoList'}],
  };
  toast('Mostrando agora: '+contratoAtivo().contrato.empreendimento+' · '+contratoAtivo().contrato.unidade);
  render({resetScroll:true});
}

function render(opts={}){
  const appbarEl = document.getElementById('appbar');
  const tabbarEl = document.getElementById('tabbar');
  const fabEl = document.getElementById('fabAgente');
  if(state.mode==='login'){
    appbarEl.style.display = 'none';
    tabbarEl.style.display = 'none';
    fabEl.hidden = true;
    document.getElementById('view').innerHTML = screenLogin().body;
    return;
  }
  appbarEl.style.display = 'flex';
  tabbarEl.style.display = 'flex';
  fabEl.hidden = state.agenteOpen;
  fabEl.innerHTML = I.chat;
  const view0 = document.getElementById('view');
  const scrollTop = view0 ? view0.scrollTop : 0;
  const {title, back, action, body} = state.agenteOpen ? screenAgenteChat() : currentScreen();
  document.getElementById('headerTitle').textContent = title;
  document.getElementById('backBtn').hidden = !back;
  document.getElementById('headerAction').innerHTML = action||'';
  const view = document.getElementById('view');
  view.innerHTML = '<div class="screen">'+body+'</div>';
  view.scrollTop = opts.resetScroll ? 0 : scrollTop;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===state.tab));
}

async function doLogin(){
  const input = document.getElementById('loginEmail');
  const email = (input?input.value:'').trim();
  state.loginEmail = email;
  if(!email){ state.loginErro = 'Digite um e-mail para continuar.'; render(); return; }

  state.loginLoading = true;
  state.loginErro = null;
  render();

  try{
    const resp = await fetch(BUYERCARE_API_BASE + '/api/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email})
    });
    const dados = await resp.json();

    if(!resp.ok || dados.erro){
      state.loginErro = dados.erro || 'Não foi possível entrar. Tente novamente.';
      state.loginLoading = false;
      render();
      return;
    }
    if(!dados.encontrado){
      state.loginErro = 'Não encontramos nenhum contrato vinculado a este e-mail.';
      state.loginLoading = false;
      render();
      return;
    }

    DB.comprador.nome = dados.nome || DB.comprador.nome;
    if(Array.isArray(dados.contratos) && dados.contratos.length){
      const real = dados.contratos[0];
      // o nome da Unidade no Salesforce as vezes ja vem com o nome do
      // empreendimento dentro (ex: "TorreBlanca - Apartamento 1002") - evita
      // repetir "TorreBlanca · TorreBlanca - Apartamento 1002" na tela
      let unidade = real.unidade || DB.contratos[0].contrato.unidade;
      if(real.empreendimento && unidade && unidade.startsWith(real.empreendimento)){
        unidade = unidade.slice(real.empreendimento.length).replace(/^[\s\-·]+/, '');
      }
      DB.contratos[0].contrato.empreendimento = real.empreendimento || DB.contratos[0].contrato.empreendimento;
      DB.contratos[0].contrato.unidade = unidade;
      DB.contratos[0].contrato.valor = real.valor || DB.contratos[0].contrato.valor;
      DB.contratos[0].oportunidadeId = real.oportunidadeId;
    }

    state.mode = 'app';
    state.loginLoading = false;
    render({resetScroll:true});
    carregarObraReal(DB.contratos[0]);
    carregarFinanceiroReal(DB.contratos[0]);
    carregarDocumentosReal(DB.contratos[0]);
    carregarAtendimentoReal(DB.contratos[0]);
  }catch(e){
    state.loginErro = 'Falha de conexão com o servidor. Tente novamente.';
    state.loginLoading = false;
    render();
  }
}
/* Busca o historico real de CA_EvolucaoObra__c do empreendimento (via proxy) e

async function carregarObraReal(contrato){
  if(!contrato.oportunidadeId) return;

  if(state.tab==='obra' || state.tab==='inicio') render();

    });

    contrato.obra.real = true;
    contrato.obra.percentualGeral = Math.round(dados.percentualGeral || 0);

      resumo: a.observacoes || 'Avanço registrado pelo time de obra.'
    }));
  }catch(e){

  if(state.tab==='obra' || state.tab==='inicio') render();

/* ---------- Avisos de obra (Web Push) ----------
   O aparelho se inscreve no servico de push do navegador e o Salesforce avisa (via Worker) quando
   sai uma atualizacao de obra no empreendimento. O push vai sem texto: o service worker mostra uma
   mensagem generica, entao nenhum dado do cliente passa pelo servico de push. */
const VAPID_PUBLIC_KEY = 'BAOfpCPo5uxktkZQKZRkuCnZ-ezdihN2W5GE3lkBRgr3EatTvbwu8dRatwRsH3XjoYAnf62cMDWO7YLIyaSSkCA';
const pushEstado = {
  suportado: ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window),
  inscrito: false, negado: false, ocupado: false, checado: false, erro: ''
};
function pushChaveParaBytes(b64u){
  const bin = atob(b64u.replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(b64u.length/4)*4,'='));
  return Uint8Array.from(bin, c=>c.charCodeAt(0));
}
async function pushVerificar(){
  if(!pushEstado.suportado || pushEstado.checado) return;
  pushEstado.checado = true;
  try{
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    pushEstado.inscrito = !!sub;
    pushEstado.negado = Notification.permission === 'denied';
    if(state.tab==='obra') render();
  }catch(e){ /* sem push neste aparelho: o cartao some */ pushEstado.suportado = false; }
}
async function pushRegistrar(endpoint, acao){
  const c = contratoAtivo();
  const resp = await fetch(BUYERCARE_API_BASE + '/api/push-inscricao', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({oportunidadeId: c.oportunidadeId, endpoint, acao})
  });
  const dados = await resp.json();
  if(!resp.ok || dados.erro) throw new Error(dados.erro || 'Falha ao registrar o aviso');
}
async function pushAlternar(){
  if(pushEstado.ocupado) return;
  const c = contratoAtivo();
  if(!c || !c.oportunidadeId){ toast('Os avisos de obra ficam disponíveis para contratos reais.'); return; }
  pushEstado.ocupado = true; pushEstado.erro = ''; render();
  try{
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(sub && pushEstado.inscrito){
      await pushRegistrar(sub.endpoint, 'cancelar');
      await sub.unsubscribe();
      pushEstado.inscrito = false;
      toast('Avisos de obra desativados');
    }else{
      const perm = await Notification.requestPermission();
      if(perm !== 'granted'){ pushEstado.negado = (perm === 'denied'); throw new Error('Permita as notificações para receber os avisos.'); }
      if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey: pushChaveParaBytes(VAPID_PUBLIC_KEY)});
      await pushRegistrar(sub.endpoint, 'inscrever');
      pushEstado.inscrito = true;
      toast('Avisos de obra ativados');
    }
  }catch(e){
    pushEstado.erro = e.message || 'Não foi possível alterar os avisos agora.';
  }
  pushEstado.ocupado = false;
  render();
}

function formatarDataBr(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function formatarDataMesAno(iso){
  if(!iso) return '';
  const meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const [y,m] = iso.split('-');
  return meses[parseInt(m,10)-1]+'/'+y;
}
/* Busca os boletos reais (CA_Boleto__c, um registro por parcela, via proxy) -
   e' o que um RPA/integracao bancaria real geraria parcela a parcela. O status
   de cada parcela agora e' REAL (Pago/Pendente/Cancelado, vem gravado no
   registro) - "Atrasado" e' a unica excecao calculada no backend (Pendente
   com vencimento no passado), nunca inventado aqui no front. */
async function carregarFinanceiroReal(contrato){
  if(!contrato.oportunidadeId) return;
  try{
    const resp = await fetch(BUYERCARE_API_BASE + '/api/financeiro', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({oportunidadeId: contrato.oportunidadeId})
    });
    const dados = await resp.json();
    if(!resp.ok || dados.erro || !Array.isArray(dados.boletos)) return;

    const parcelas = dados.boletos.map(b => ({
      id:'boleto-'+b.numeroParcela,
      desc:'Parcela '+b.numeroParcela,
      valor: b.valor,
      vencimento: formatarDataBr(b.vencimento),
      dataPagamento: b.dataPagamento? formatarDataBr(b.dataPagamento) : null,
      status: b.status,
      codigoBarras: b.codigoBarras || null
    }));
    contrato.parcelas = parcelas;
    contrato.financeiroReal = true;
    if(dados.valorTotalContrato) contrato.contrato.valor = dados.valorTotalContrato;
    if(state.tab==='financeiro' || state.tab==='inicio') render();
  }catch(e){
    // mantem o mock se a rede falhar - nao quebra a tela
  }
}

   contrato assinado, anexado ao Contract) - nao e' o checklist que o corretor usa
   pra coletar RG/CPF/comprovantes do lead antes da venda (esse e' outro conceito,
   do CodeChave, e nao faz sentido aqui: o cliente do CodeLar ja' comprou). Se a
   org um dia tiver "manual do proprietario" ou outros documentos anexados ao
   Contract, eles aparecem aqui automaticamente - nao inventamos placeholder pros

async function baixarDocumentoReal(contentVersionId){
  const c = contratoAtivo();
  const doc = c.documentos.find(d=>d.contentVersionId===contentVersionId);
  const nomeArquivo = doc? doc.nome : 'documento';
  const tipoArquivo = doc? doc.tipoArquivo : '';
  toast('Baixando documento...');
  try{
    const resp = await fetch(BUYERCARE_API_BASE + '/api/documento-arquivo', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({oportunidadeId: c.oportunidadeId, contentVersionId})
    });
    const dados = await resp.json();
    if(!resp.ok || dados.erro || !dados.conteudoBase64){
      toast('Não foi possível baixar o documento.');
      return;
    }
    const mime = {PDF:'application/pdf', JPG:'image/jpeg', JPEG:'image/jpeg', PNG:'image/png'}[(dados.tipoArquivo||'').toUpperCase()] || 'application/octet-stream';
    const bytes = atob(dados.conteudoBase64);
    const arr = new Uint8Array(bytes.length);
    for(let i=0;i<bytes.length;i++) arr[i] = bytes.charCodeAt(i);
    const blob = new Blob([arr], {type: mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = nomeArquivo + (tipoArquivo? '.'+tipoArquivo.toLowerCase() : '');
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(e){
    toast('Falha de conexão ao baixar o documento.');
  }
}

async function salvarNovoAtendimentoReal(categoria, ambiente, descricao, anexos){
  const c = contratoAtivo();
  try{
    const resp = await fetch(BUYERCARE_API_BASE + '/api/atendimento-novo', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({oportunidadeId: c.oportunidadeId, categoria, ambiente, descricao})
    });
    const dados = await resp.json();
    if(!resp.ok || dados.erro || !dados.protocolo){
      toast('Não foi possível registrar a solicitação.');
      return;
    }

    let falhasAnexo = 0;
    if(anexos && anexos.length && dados.caseId){
      for(const a of anexos){
        try{
          const respAnexo = await fetch(BUYERCARE_API_BASE + '/api/atendimento-anexo', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({oportunidadeId: c.oportunidadeId, caseId: dados.caseId, nomeArquivo: a.nome, tipoArquivo: a.tipo, conteudoBase64: a.base64})
          });
          const dadosAnexo = await respAnexo.json();
          if(!respAnexo.ok || dadosAnexo.erro) falhasAnexo++;
        }catch(e){ falhasAnexo++; }
      }
    }

    toast(
      falhasAnexo
        ? 'Solicitação '+dados.protocolo+' registrada ('+falhasAnexo+' anexo(s) não enviado(s))'
        : 'Solicitação '+dados.protocolo+' registrada'
    );
    resetTabTo('atendimentoList');
    await carregarAtendimentoReal(c);
    render();
  }catch(e){
    toast('Falha de conexão ao registrar a solicitação.');
  }
}

async function enviarSolicitacaoFinanceira(parcelaInfo){
  const assunto = document.getElementById('sf-assunto').value;
  const descricao = document.getElementById('sf-desc').value.trim();
  if(!descricao){ toast('Descreva sua solicitação antes de enviar.'); return; }

  const c = contratoAtivo();
  if(!c.financeiroReal){
    toast('Solicitação enviada ao financeiro');
    goBack();
    return;
  }

  const btn = document.getElementById('sf-enviar');
  btn.disabled = true;
  btn.textContent = 'Enviando...';
  try{
    const resp = await fetch(BUYERCARE_API_BASE + '/api/solicitacao-financeira', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({oportunidadeId: c.oportunidadeId, assunto, descricao, parcelaInfo: parcelaInfo || undefined})
    });
    const dados = await resp.json();
    if(!resp.ok || dados.erro || !dados.protocolo){
      toast('Não foi possível registrar a solicitação.');
      btn.disabled = false;
      btn.textContent = 'Enviar solicitação';
      return;
    }
    toast('Solicitação '+dados.protocolo+' enviada ao financeiro');
    goBack();
  }catch(e){
    toast('Falha de conexão ao registrar a solicitação.');
    btn.disabled = false;
    btn.textContent = 'Enviar solicitação';
  }
}

async function enviarComentarioAtendimento(protocolo, tipo){
  const c = contratoAtivo();
  const texto = (document.getElementById(tipo==='mensagem'?'am-texto':'av-texto').value || '').trim();
  if(tipo==='mensagem' && !texto){ toast('Escreva a mensagem antes de enviar.'); return; }
  const nota = tipo==='avaliacao' ? parseInt(document.getElementById('av-nota').value,10) : undefined;
  const rotulo = tipo==='mensagem' ? 'Enviar mensagem' : 'Enviar avaliação';

  const btn = document.getElementById('am-enviar');
  btn.disabled = true;
  btn.textContent = 'Enviando...';
  try{
    const resp = await fetch(BUYERCARE_API_BASE + '/api/atendimento-comentario', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({oportunidadeId: c.oportunidadeId, protocolo, tipo, texto: texto || undefined, nota})
    });
    const dados = await resp.json();
    if(!resp.ok || dados.erro){
      toast(dados.erro || 'Não foi possível enviar agora.');
      btn.disabled = false;
      btn.textContent = rotulo;
      return;
    }
    toast(tipo==='mensagem' ? 'Mensagem enviada ao time técnico' : 'Obrigado! Avaliação registrada.');
    goBack();
  }catch(e){
    toast('Falha de conexão. Tente novamente.');
    btn.disabled = false;
    btn.textContent = rotulo;
  }
}

function lerArquivoComoBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve((reader.result || '').split(',')[1] || '');
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function handleAnexosSelecionados(input){
  const arquivos = Array.from(input.files || []);
  for(const file of arquivos){
    if(file.size > 8*1024*1024){
      toast('"'+file.name+'" passa de 8MB e não foi anexado.');
      continue;
    }
    const base64 = await lerArquivoComoBase64(file);
    const tipo = (file.name.split('.').pop() || '').toLowerCase();
    state.novoAtendimento.anexos.push({ nome: file.name, tipo, base64 });
  }
  input.value = '';
  render();
}
function removerAnexo(idx){
  state.novoAtendimento.anexos.splice(idx, 1);
  render();
}
async function salvarNovoAtendimento(){
  const ambiente = document.getElementById('na-ambiente').value.trim();
  const tipoSel = document.getElementById('na-tipo');
  const tipo = tipoSel.value || 'Outros';
  const descricao = document.getElementById('na-desc').value.trim() || 'Sem descrição detalhada.';
  const anexos = state.novoAtendimento.anexos;

  const c = contratoAtivo();
  if(c.atendimentoReal){
    const btn = document.getElementById('na-enviar');
    btn.disabled = true;
    btn.textContent = 'Enviando...';
    await salvarNovoAtendimentoReal(tipo, ambiente, descricao, anexos);
    state.novoAtendimento = {ambiente:'', tipo:'', descricao:'', data:'', anexos:[]};
    return;
  }

  nextAtendimentoNum++;
  const novo = {
    id:'at'+Date.now(), protocolo:'AT-2026-0'+nextAtendimentoNum, tipo, ambiente: ambiente||'Não informado', descricao,
    status:'Em andamento', sla:'Resposta em até 2 dias úteis',
    data:new Date().toLocaleDateString('pt-BR'),
  };
  c.atendimentos.unshift(novo);
  state.novoAtendimento = {ambiente:'', tipo:'', descricao:'', data:'', anexos:[]};
  resetTabTo('atendimentoList');
  toast('Solicitação '+novo.protocolo+' registrada');
}

const SUGESTOES = [
  'Quando vence minha próxima parcela?',

function screenAgenteChat(){
  const body = `

  `;

  return {title:'Agente virtual', back:false, action, body};

function respostaAgente(pergunta){
  const p = pergunta.toLowerCase();
  const c = contratoAtivo();
  const rotuloUnidade = DB.contratos.length>1 ? ` (${c.contrato.empreendimento} · ${c.contrato.unidade})` : '';
  if(p.includes('próxima parcela') || p.includes('vence')){
    const prox = c.parcelas.find(x=>x.status!=='Pago');
    return prox ? `Sua próxima parcela em aberto${rotuloUnidade} é <b>${prox.desc}</b>, no valor de <b>${brl(prox.valor)}</b>, com vencimento em <b>${prox.vencimento}</b>.` : `Você não tem parcelas em aberto${rotuloUnidade} no momento. 🎉`;
  }
  if(p.includes('segunda via') || p.includes('boleto')){
    return 'No modo demonstração eu não consigo gerar a 2ª via. Em produção, o time financeiro envia pra você.';
  }
  if(p.includes('documentos')){
    const pend = c.documentos.filter(d=>d.status==='Pendente');
    return pend.length ? `Ainda falta enviar${rotuloUnidade}: <b>${pend.map(d=>d.nome).join(', ')}</b>. Quer que eu te leve até lá?` : `Todos os seus documentos estão em dia${rotuloUnidade}. ✅`;
  }
  if(p.includes('obra') || p.includes('andamento')){
    return `A obra${rotuloUnidade} está com <b>${c.obra.percentualGeral}%</b> de evolução geral, com previsão de conclusão em <b>${c.obra.previsao}</b>.`;
  }
  if(p.includes('vistoria')){
    return 'A etapa de vistoria ainda não foi liberada para essa unidade — você será avisado por aqui assim que ela abrir.';
  }
  if(p.includes('assistência') || p.includes('assistencia')){
    return 'Posso te levar direto para abrir uma nova assistência técnica. Toque em "Abrir atendimento" nos atalhos da tela Início, ou na aba Atendimento.';
  }
  if(p.includes('outro imóvel') || p.includes('outra unidade') || p.includes('trocar de unidade')){
    return DB.contratos.length>1 ? `Você tem ${DB.contratos.length} imóveis com a Codeart. Toque em "Ver outros imóveis" na tela Início pra trocar de unidade.` : 'Você tem apenas uma unidade cadastrada no momento.';
  }
  return 'Entendi! Vou encaminhar essa solicitação para a equipe responsável e te aviso por aqui assim que houver uma atualização.';
}
function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function enviarMensagemAgente(ev){
  ev.preventDefault();
  const input = document.getElementById('chatInput');
  const texto = input.value.trim();
  if(!texto || state.chatEnviando) return;
  perguntarAgente(texto);
}
function rolarChat(){
  const wrap = document.getElementById('chatWrap');
  if(wrap) wrap.scrollIntoView({block:'end'});
  const input = document.getElementById('chatInput');
  if(input && !input.disabled) input.focus();
}
async function perguntarAgente(texto){
  const c = contratoAtivo();
  if(state.chatEnviando) return;

  if(!c.oportunidadeId){
    state.chat.push({from:'user', text:texto});
    state.chat.push({from:'bot', text:respostaAgente(texto), html:true});
    render();
    rolarChat();
    return;
  }

  const historico = state.chat.slice(-6).map(m=>({from:m.from, text:m.html? m.text.replace(/<[^>]+>/g,'') : m.text}));
  state.chat.push({from:'user', text:texto});
  state.chatEnviando = true;
  render();
  rolarChat();
  try{
    const resp = await fetch(BUYERCARE_API_BASE + '/api/agente', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({oportunidadeId: c.oportunidadeId, mensagem: texto, historico})
    });
    const dados = await resp.json();
    if(!resp.ok || dados.erro || !dados.resposta){
      state.chat.push({from:'bot', text:'Não consegui responder agora. Tente de novo em instantes ou use a aba Atendimento.'});
    } else {
      state.chat.push({from:'bot', text:dados.resposta});
    }
  }catch(e){
    state.chat.push({from:'bot', text:'Sem conexão com o servidor no momento. Tente novamente.'});
  }
  state.chatEnviando = false;
  render();
  rolarChat();
}
